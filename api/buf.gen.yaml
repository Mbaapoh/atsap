version: v2
plugins:
  # Both Go plugins are pinned. Unpinned, `buf generate` resolved
  # connectrpc/go to its v2 major and rewrote every service onto a runtime
  # go.mod does not have (found while adding the trunk RPCs). Pins match
  # what generated the committed code: protoc-gen-go v1.36.12 (the version
  # in every .pb.go header) and connect-go v1.18.1, which regenerates the
  # untouched services byte-identical.
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: internal/genproto
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v1.18.1
    out: internal/genproto
    opt: paths=source_relative
  # OpenAPI v3 for the Connect surface (identity-api task 1.3;
  # docs/API.md §5). protoc-gen-connect-openapi (sudorandom, MIT) describes
  # Connect's actual HTTP scheme — POST /<package>.<Service>/<Method> with
  # Connect's error model — not grpc-gateway routes this server does not
  # serve. Remote and pinned; the generated document is committed to
  # docs/api/openapi.yaml so it cannot drift from the protos (TOOLSET §6).
  - remote: buf.build/community/sudorandom-connect-openapi:v0.19.1
    out: ../docs/api
    opt:
      # No `services=` filter: the document describes every service this
      # server exposes. Filtering it to IdentityService left GetCall —
      # listed as exposed in docs/API.md §1 — absent from the published
      # spec, so "documented API" (US-05.1) was only half true.
      - path=openapi.yaml
