syntax = "proto3";

package atsapbx.v1;

import "google/protobuf/timestamp.proto";

option go_package = "atsap-api/internal/genproto/atsapbx/v1;atsapbxv1";

// PbxService is pbx-core's public contract: the configuration a customer
// performs in the console, and which a partner may perform directly
// against the same API (BRD §16 — the console is a consumer of this API,
// not a privileged client with a private back door).
//
// Every method requires `Authorization: Bearer <JWT>` and acts only
// within the caller's own tenant. A resource belonging to another tenant
// answers exactly as one that does not exist (INV-10).
//
// **Nothing in this file names the media engine.** No endpoint
// identifier, dialplan context, transport, table or object of the
// underlying engine appears in any request, response, or error a caller
// can see. A customer configures "extension 1005"; how that becomes live
// engine state is the platform's business (PRD principle 4, DECISIONS
// D-47).
//
// The generated secret appears in exactly two responses —
// CreateExtension and RegenerateSecret — and in no other message, ever.
// It is shown once and is not retrievable afterwards; an extension whose
// secret is lost is rotated, not recovered.
service PbxService {
  // CreateExtension provisions an extension and makes it registrable by
  // a device. No apply step follows: it is live when this returns.
  rpc CreateExtension(CreateExtensionRequest) returns (CreateExtensionResponse);

  // GetExtension reads one extension, including whether a device is
  // currently registered to it.
  rpc GetExtension(GetExtensionRequest) returns (GetExtensionResponse);

  // ListExtensions returns a page of the calling tenant's extensions.
  rpc ListExtensions(ListExtensionsRequest) returns (ListExtensionsResponse);

  // UpdateExtension changes an extension's display name or device type.
  // The number is immutable: renumbering would orphan every device
  // already provisioned against it, so it is a delete plus a create.
  rpc UpdateExtension(UpdateExtensionRequest) returns (UpdateExtensionResponse);

  // DeleteExtension removes an extension and deprovisions it. A device
  // holding its former credential can no longer register, immediately.
  rpc DeleteExtension(DeleteExtensionRequest) returns (DeleteExtensionResponse);

  // AssignExtension makes a membership the owner of an extension (D-65).
  // An extension has at most one owner; a person may own several.
  rpc AssignExtension(AssignExtensionRequest) returns (AssignExtensionResponse);

  // IVR flows (D-89): a DID routes through a versioned flow that chooses
  // its open/closed destination by business hours and holidays.
  rpc CreateFlow(CreateFlowRequest) returns (FlowResponse);
  rpc GetFlow(GetFlowRequest) returns (FlowResponse);
  rpc ListFlows(ListFlowsRequest) returns (ListFlowsResponse);
  rpc PublishFlow(PublishFlowRequest) returns (FlowResponse);
  rpc RollbackFlow(RollbackFlowRequest) returns (FlowResponse);
  rpc DeleteFlow(DeleteFlowRequest) returns (DeleteFlowResponse);
  rpc ListFlowVersions(ListFlowVersionsRequest) returns (ListFlowVersionsResponse);
  rpc ListHolidays(ListHolidaysRequest) returns (HolidaysResponse);
  rpc AddHoliday(AddHolidayRequest) returns (HolidaysResponse);
  rpc DeleteHoliday(DeleteHolidayRequest) returns (HolidaysResponse);
  rpc UnassignExtension(UnassignExtensionRequest) returns (UnassignExtensionResponse);

  // RegenerateSecret issues a new credential. The previous one stops
  // working the moment this returns — two live credentials for one
  // extension is the state a rotation exists to end.
  rpc RegenerateSecret(RegenerateSecretRequest) returns (RegenerateSecretResponse);

  // GetSipRegistrar returns where devices register: the installation's
  // public SIP registrar address, as its installer configured it. When no
  // public host is configured it says so (configured = false) rather than
  // guess. Authorized like reading the tenant's extensions.
  rpc GetSipRegistrar(GetSipRegistrarRequest) returns (GetSipRegistrarResponse);

  // Outbound protection: spend caps, blocked prefixes, anomaly detection
  // and an automatic suspension (D-85, AC-08.1/08.2).
  rpc GetOutboundPolicy(GetOutboundPolicyRequest) returns (GetOutboundPolicyResponse);
  rpc UpdateOutboundPolicy(UpdateOutboundPolicyRequest) returns (UpdateOutboundPolicyResponse);
  rpc ResumeOutbound(ResumeOutboundRequest) returns (ResumeOutboundResponse);

  // CreateTrunk connects a partner-owned SIP carrier (BYOT). The carrier
  // secret, if any, is accepted here and on UpdateTrunk and is never
  // returned by any call — unlike an extension secret, it was chosen by
  // the carrier, not generated, so there is nothing to show once.
  rpc CreateTrunk(CreateTrunkRequest) returns (CreateTrunkResponse);

  // ListTrunks returns a page of the calling tenant's trunks, with the
  // health the platform has observed for each.
  rpc ListTrunks(ListTrunksRequest) returns (ListTrunksResponse);

  // UpdateTrunk replaces a trunk's configuration. An empty secret keeps
  // the stored one; an empty auth_username makes the trunk
  // IP-authenticated and discards any stored secret. Health is not an
  // input: it is observed, never set.
  rpc UpdateTrunk(UpdateTrunkRequest) returns (UpdateTrunkResponse);

  // DeleteTrunk disconnects a carrier, together with every route that
  // sends to it. It is never selected again from the moment this
  // returns; calls already in progress are unaffected.
  rpc DeleteTrunk(DeleteTrunkRequest) returns (DeleteTrunkResponse);

  // CreateRoute sends dialled numbers matching a prefix pattern to one of
  // the tenant's own trunks. Overlapping patterns are allowed: overlap is
  // how least-cost preference is expressed.
  rpc CreateRoute(CreateRouteRequest) returns (CreateRouteResponse);

  // ListRoutes returns a page of the calling tenant's outbound routes.
  rpc ListRoutes(ListRoutesRequest) returns (ListRoutesResponse);

  // DeleteRoute removes an outbound route.
  rpc DeleteRoute(DeleteRouteRequest) returns (DeleteRouteResponse);

  // PlaceCall places a call from one of the tenant's extensions to a
  // destination as dialled. The platform's dial plan decides how it is
  // reached: an emergency number first, then another extension, then the
  // tenant's outbound routes. The caller's extension is rung first and the
  // destination only after it answers; an unanswered caller ends the call
  // with caller_no_answer and the destination is never rung. The request has no
  // field that names an engine endpoint or could exempt a call from
  // checks — only the dial plan recognises an emergency number.
  rpc PlaceCall(PlaceCallRequest) returns (PlaceCallResponse);

  // HangupCall ends a call placed with PlaceCall. Ending a call that has
  // already ended succeeds and changes nothing.
  rpc HangupCall(HangupCallRequest) returns (HangupCallResponse);

  // SetEmergencyProfile sets the tenant's emergency country (ISO 3166-1
  // alpha-2, upper case). Its catalogue numbers join 112 in the
  // effective emergency set from the next call on.
  rpc SetEmergencyProfile(SetEmergencyProfileRequest) returns (SetEmergencyProfileResponse);

  // GetEmergencyProfile renders the tenant's effective emergency set:
  // 112, its country's catalogue numbers, and its own additions, each
  // marked built-in or own. It also reports whether a country is set and
  // whether it names a catalogued country.
  rpc GetEmergencyProfile(GetEmergencyProfileRequest) returns (GetEmergencyProfileResponse);

  // CreateEmergencyNumber adds one of the tenant's own emergency
  // numbers. Numbers already effective (112, catalogue) cannot be added.
  rpc CreateEmergencyNumber(CreateEmergencyNumberRequest) returns (CreateEmergencyNumberResponse);

  // ListEmergencyNumbers returns the tenant's effective emergency set.
  rpc ListEmergencyNumbers(ListEmergencyNumbersRequest) returns (ListEmergencyNumbersResponse);

  // DeleteEmergencyNumber removes one of the tenant's own numbers. 112
  // and catalogue numbers are built-in and cannot be removed.
  rpc DeleteEmergencyNumber(DeleteEmergencyNumberRequest) returns (DeleteEmergencyNumberResponse);

  // CreateInboundNumber assigns one of the tenant's inbound numbers
  // (DIDs) to one of its extensions. A carrier call to the number rings
  // that extension.
  rpc CreateInboundNumber(CreateInboundNumberRequest) returns (CreateInboundNumberResponse);

  // ListInboundNumbers returns the tenant's inbound numbers.
  rpc ListInboundNumbers(ListInboundNumbersRequest) returns (ListInboundNumbersResponse);

  // DeleteInboundNumber releases an inbound number. The extension keeps
  // working; only the public number stops ringing it.
  rpc DeleteInboundNumber(DeleteInboundNumberRequest) returns (DeleteInboundNumberResponse);
}

// DeviceType is how a device attaches to an extension.
enum DeviceType {
  DEVICE_TYPE_UNSPECIFIED = 0;
  DEVICE_TYPE_WEBRTC = 1;
  DEVICE_TYPE_SIP = 2;
}

// RegistrationStatus describes the DEVICE, not the configuration. An
// extension is configured and live from the moment it is created,
// whether or not anything has registered to it — there is no "pending"
// state, because there is nothing to apply.
// OutboundClass is how far an extension may dial (LLD-03 §10.2).
enum OutboundClass {
  OUTBOUND_CLASS_UNSPECIFIED = 0;
  OUTBOUND_CLASS_INTERNAL = 1;
  OUTBOUND_CLASS_NATIONAL = 2;
  OUTBOUND_CLASS_INTERNATIONAL = 3;
}

enum RegistrationStatus {
  REGISTRATION_STATUS_UNSPECIFIED = 0;
  REGISTRATION_STATUS_NOT_REGISTERED = 1;
  REGISTRATION_STATUS_REGISTERED = 2;
}

// Extension is what a caller sees. It carries no credential digest and
// no engine object of any kind.
message Extension {
  string extension_id = 1;
  // Tenant-local: two tenants may each have a 1000, and they are
  // unrelated extensions with unrelated credentials.
  string number = 2;
  string display_name = 3;
  // The username a device presents. Generated by the platform and
  // deliberately not derived from the number, so knowing a tenant's
  // numbering plan reveals nothing about what to authenticate as.
  string auth_username = 4;
  DeviceType device_type = 5;
  RegistrationStatus registration = 6;
  // How far this extension may dial. A new extension is NATIONAL unless
  // the caller chose otherwise.
  OutboundClass outbound_class = 7;
  // The owning membership, empty when the extension has no owner (D-65).
  string assigned_principal_id = 8;
  string assigned_principal_name = 9;
  string assigned_principal_email = 10;
}

message CreateExtensionRequest {
  string tenant_id = 1;
  string number = 2;
  string display_name = 3;
  DeviceType device_type = 4;
  // Optional; NATIONAL when unspecified. INTERNAL dials extensions only,
  // NATIONAL adds numbers without a leading "+", INTERNATIONAL adds all.
  OutboundClass outbound_class = 5;
  // Note there is no secret field. The platform generates the
  // credential; a caller cannot choose one, because a chosen secret
  // would be the weak link in a digest that is offline-crackable.
}

message CreateExtensionResponse {
  Extension extension = 1;
  // The generated secret, returned exactly once. Never logged, never
  // audited, never retrievable by any later call.
  string secret = 2;
}

message GetExtensionRequest {
  string tenant_id = 1;
  string extension_id = 2;
}

message GetExtensionResponse {
  Extension extension = 1;
}

message ListExtensionsRequest {
  string tenant_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListExtensionsResponse {
  repeated Extension extensions = 1;
}

message UpdateExtensionRequest {
  string tenant_id = 1;
  string extension_id = 2;
  string display_name = 3;
  DeviceType device_type = 4;
  OutboundClass outbound_class = 5;
}

message UpdateExtensionResponse {
  Extension extension = 1;
}

message DeleteExtensionRequest {
  string tenant_id = 1;
  string extension_id = 2;
}

message DeleteExtensionResponse {}

message FlowConfig {
  string open_extension_id = 1;
  string closed_extension_id = 2;
  int32 business_start_minute = 3;
  int32 business_end_minute = 4;
  string prompt = 5;
}

message Flow {
  string flow_id = 1;
  string number = 2;
  string name = 3;
  int32 active_version = 4;
  FlowConfig config = 5;
}

message FlowResponse { Flow flow = 1; }
message CreateFlowRequest { string tenant_id = 1; string number = 2; string name = 3; FlowConfig config = 4; }
message GetFlowRequest { string tenant_id = 1; string flow_id = 2; }
message ListFlowsRequest { string tenant_id = 1; }
message ListFlowsResponse { repeated Flow flows = 1; }
message PublishFlowRequest { string tenant_id = 1; string flow_id = 2; FlowConfig config = 3; }
message RollbackFlowRequest { string tenant_id = 1; string flow_id = 2; int32 version = 3; }
message DeleteFlowRequest { string tenant_id = 1; string flow_id = 2; }
message DeleteFlowResponse {}
message FlowVersion {
  int32 version = 1;
  FlowConfig config = 2;
  google.protobuf.Timestamp published_at = 3;
  string published_by = 4;
}
message ListFlowVersionsRequest { string tenant_id = 1; string flow_id = 2; }
message ListFlowVersionsResponse { repeated FlowVersion versions = 1; }
message Holiday { string day = 1; string name = 2; }
message HolidaysResponse { repeated Holiday holidays = 1; }
message ListHolidaysRequest { string tenant_id = 1; }
message AddHolidayRequest { string tenant_id = 1; string day = 2; string name = 3; }
message DeleteHolidayRequest { string tenant_id = 1; string day = 2; }

message AssignExtensionRequest {
  string tenant_id = 1;
  string extension_id = 2;
  string principal_id = 3;
}
message AssignExtensionResponse { Extension extension = 1; }

message UnassignExtensionRequest {
  string tenant_id = 1;
  string extension_id = 2;
}
message UnassignExtensionResponse { Extension extension = 1; }

message RegenerateSecretRequest {
  string tenant_id = 1;
  string extension_id = 2;
}

message RegenerateSecretResponse {
  Extension extension = 1;
  // The new secret, returned exactly once, as at creation.
  string secret = 2;
}

message GetSipRegistrarRequest {
  string tenant_id = 1;
}

message GetSipRegistrarResponse {
  // False when the installation has not configured a public registrar
  // host; host is then empty and the other fields carry no meaning.
  bool configured = 1;
  // A hostname or IP address, with no scheme, port or user part.
  string host = 2;
  int32 port = 3;
  // "udp", "tcp" or "tls".
  string transport = 4;
  // The WebRTC signalling endpoint (ws:// for the dev rig, wss:// in
  // production); empty when the installation has not configured one. It
  // is public configuration, never a secret.
  string webrtc_url = 5;
  // STUN/TURN servers for browser media behind NAT (D-84). The
  // credential is readable by signed-in tenants on purpose.
  repeated IceServer ice_servers = 6;
}

message OutboundPolicy {
  int64 daily_spend_cap_micros = 1;
  int64 monthly_spend_cap_micros = 2;
  repeated string blocked_prefixes = 3;
  int32 anomaly_call_threshold = 4;
  int32 anomaly_window_seconds = 5;
  int32 business_start_minute = 6;
  int32 business_end_minute = 7;
  bool suspended = 8;
  google.protobuf.Timestamp suspended_at = 9;
  string suspended_reason = 10;
}

message GetOutboundPolicyRequest { string tenant_id = 1; }
message GetOutboundPolicyResponse { OutboundPolicy policy = 1; }

message UpdateOutboundPolicyRequest {
  string tenant_id = 1;
  int64 daily_spend_cap_micros = 2;
  int64 monthly_spend_cap_micros = 3;
  repeated string blocked_prefixes = 4;
  int32 anomaly_call_threshold = 5;
  int32 anomaly_window_seconds = 6;
  int32 business_start_minute = 7;
  int32 business_end_minute = 8;
}
message UpdateOutboundPolicyResponse { OutboundPolicy policy = 1; }

message ResumeOutboundRequest { string tenant_id = 1; }
message ResumeOutboundResponse { OutboundPolicy policy = 1; }

message IceServer {
  repeated string urls = 1;
  string username = 2;
  string credential = 3;
}

// TrunkHealth is what the platform has OBSERVED about a carrier: its own
// SIP OPTIONS checks and the outcomes of calls through the trunk. No
// request carries it: a trunk shown healthy because someone ticked a box
// would be worse than showing nothing.
enum TrunkHealth {
  TRUNK_HEALTH_UNSPECIFIED = 0;
  TRUNK_HEALTH_HEALTHY = 1;
  // Still selected, but only after every healthy trunk.
  TRUNK_HEALTH_DEGRADED = 2;
  // Skipped by route selection until a good observation.
  TRUNK_HEALTH_UNHEALTHY = 3;
  // Not checked yet: a new trunk, until its first check. Selected as a
  // healthy trunk is, so it works at once.
  TRUNK_HEALTH_UNKNOWN = 4;
}

// TrunkHealthReason says why a trunk has its health.
enum TrunkHealthReason {
  TRUNK_HEALTH_REASON_UNSPECIFIED = 0;
  // The carrier responds promptly.
  TRUNK_HEALTH_REASON_ANSWERING = 1;
  // The carrier responds, but slowly.
  TRUNK_HEALTH_REASON_SLOW_RESPONSE = 2;
  // The trunk's host name does not resolve.
  TRUNK_HEALTH_REASON_HOST_NOT_FOUND = 3;
  // The carrier does not respond in time.
  TRUNK_HEALTH_REASON_NO_RESPONSE = 4;
  // The carrier responds with a server error.
  TRUNK_HEALTH_REASON_CARRIER_ERROR = 5;
  // The trunk's host name resolves only to addresses that cannot be a
  // carrier (loopback, link-local, unspecified or multicast); nothing was
  // sent to them.
  TRUNK_HEALTH_REASON_ADDRESS_NOT_ALLOWED = 6;
  // The rolling call-setup failure rate, not a check, degraded the trunk
  // (HLD T-6, D-80).
  TRUNK_HEALTH_REASON_CALL_SETUP_FAILURES = 7;
}

// Trunk is what a caller sees of a carrier connection. It carries no
// secret and no engine object of any kind.
message Trunk {
  string trunk_id = 1;
  string name = 2;
  // A hostname or IP address — no scheme, port or user part.
  string host = 3;
  int32 port = 4;
  // The carrier digest username, if the carrier uses one. Configuration,
  // not a secret, so it is shown, as every SIP-trunk interface shows it.
  string auth_username = 5;
  // Whether a carrier secret is stored. The secret itself is never
  // returned.
  bool has_secret = 6;
  int32 channel_limit = 7;
  // Lower is preferred.
  int32 priority = 8;
  TrunkHealth health = 9;
  // Why the trunk has its health, and when it was last observed. Unset
  // until the trunk is first observed.
  TrunkHealthReason health_reason = 10;
  google.protobuf.Timestamp health_observed_at = 11;
  // The carrier's published signalling addresses and CIDR ranges, which
  // its calls are also recognised from (besides the host's own
  // addresses). A single address is shown without a prefix length.
  repeated string inbound_addresses = 12;
}

message CreateTrunkRequest {
  string tenant_id = 1;
  string name = 2;
  string host = 3;
  // 0 means the SIP default, 5060.
  int32 port = 4;
  // Leave auth_username and secret empty for a carrier that
  // authenticates by source IP. A secret requires a username.
  string auth_username = 5;
  string secret = 6;
  // Concurrent-call cap on this trunk; must be positive.
  int32 channel_limit = 7;
  int32 priority = 8;
  // Optional: up to 20 IP addresses or CIDR ranges (no broader than /16
  // for IPv4, /32 for IPv6) the carrier sends calls from, when they
  // differ from the host. Loopback, link-local, unspecified and
  // multicast addresses are refused.
  repeated string inbound_addresses = 9;
}

message CreateTrunkResponse {
  Trunk trunk = 1;
}

message ListTrunksRequest {
  string tenant_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListTrunksResponse {
  repeated Trunk trunks = 1;
}

message UpdateTrunkRequest {
  string tenant_id = 1;
  string trunk_id = 2;
  string name = 3;
  string host = 4;
  // 0 means the SIP default, 5060.
  int32 port = 5;
  string auth_username = 6;
  // Empty keeps the stored secret; non-empty replaces it.
  string secret = 7;
  int32 channel_limit = 8;
  int32 priority = 9;
  // Replaces the trunk's inbound signalling addresses, as every other
  // field is replaced: none supplied means none.
  repeated string inbound_addresses = 10;
}

message UpdateTrunkResponse {
  Trunk trunk = 1;
}

message DeleteTrunkRequest {
  string tenant_id = 1;
  string trunk_id = 2;
}

message DeleteTrunkResponse {}

// Route sends dialled numbers matching prefix_pattern to trunk_id.
message Route {
  string route_id = 1;
  // An optional leading + then digits and X (any one digit), e.g. "44",
  // "+1", "447X". Not an expression language.
  string prefix_pattern = 2;
  string trunk_id = 3;
  // Stored cost in millionths of the currency unit per minute. Used only
  // to break ties; it is not a rating model.
  int64 cost_per_minute_micros = 4;
  // Lower wins among patterns of equal length.
  int32 priority = 5;
}

message CreateRouteRequest {
  string tenant_id = 1;
  string prefix_pattern = 2;
  string trunk_id = 3;
  int64 cost_per_minute_micros = 4;
  int32 priority = 5;
}

message CreateRouteResponse {
  Route route = 1;
}

message ListRoutesRequest {
  string tenant_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListRoutesResponse {
  repeated Route routes = 1;
}

message DeleteRouteRequest {
  string tenant_id = 1;
  string route_id = 2;
}

message DeleteRouteResponse {}

message PlaceCallRequest {
  string tenant_id = 1;
  // The extension placing the call; it must have a registered device.
  string extension_id = 2;
  // The digits as dialled: an optional leading + then digits only.
  string destination = 3;
}

message PlaceCallResponse {
  // Read the call's progress with TelephonyService.GetCall.
  string call_id = 1;
}

message HangupCallRequest {
  string tenant_id = 1;
  string call_id = 2;
}

message HangupCallResponse {}

// EmergencyNumber is one effective emergency number and where it comes
// from. Built-in numbers (112, the country's catalogue) cannot be
// removed; the tenant's own additions can.
message EmergencyNumber {
  string number = 1;
  bool built_in = 2;
}

message SetEmergencyProfileRequest {
  string tenant_id = 1;
  // ISO 3166-1 alpha-2, upper case, e.g. "CM".
  string country_code = 2;
}

message SetEmergencyProfileResponse {}

message GetEmergencyProfileRequest {
  string tenant_id = 1;
}

message GetEmergencyProfileResponse {
  // Empty when no country was ever set.
  string country_code = 1;
  bool country_set = 2;
  // False when no country is set or it names no catalogued country: the
  // console should prompt the tenant to enter its numbers.
  bool in_catalogue = 3;
  repeated EmergencyNumber numbers = 4;
}

message CreateEmergencyNumberRequest {
  string tenant_id = 1;
  // Digits with an optional leading +, e.g. "1500".
  string number = 2;
}

message CreateEmergencyNumberResponse {}

message ListEmergencyNumbersRequest {
  string tenant_id = 1;
}

message ListEmergencyNumbersResponse {
  repeated EmergencyNumber numbers = 1;
}

message DeleteEmergencyNumberRequest {
  string tenant_id = 1;
  string number = 2;
}

message DeleteEmergencyNumberResponse {}

// InboundNumber is a public number that rings one of the tenant's
// extensions. It carries no engine object of any kind.
message InboundNumber {
  string inbound_number_id = 1;
  // Digits as stored; a leading + is not significant.
  string number = 2;
  string extension_id = 3;
}

message CreateInboundNumberRequest {
  string tenant_id = 1;
  string number = 2;
  string extension_id = 3;
}

message CreateInboundNumberResponse {
  InboundNumber inbound_number = 1;
}

message ListInboundNumbersRequest {
  string tenant_id = 1;
}

message ListInboundNumbersResponse {
  repeated InboundNumber numbers = 1;
}

message DeleteInboundNumberRequest {
  string tenant_id = 1;
  string inbound_number_id = 2;
}

message DeleteInboundNumberResponse {}
