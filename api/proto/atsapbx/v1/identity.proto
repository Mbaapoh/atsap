syntax = "proto3";

package atsapbx.v1;

import "google/protobuf/timestamp.proto";

option go_package = "atsap-api/internal/genproto/atsapbx/v1;atsapbxv1";

// IdentityService is the identity context's public contract: obtaining a
// token, administering tenants and principals, granting roles, issuing
// API keys, and reading audit history.
//
// Every method except AuthenticateUser requires
// `Authorization: Bearer <JWT>`. AuthenticateUser is exempt by
// necessity, not exception — a caller cannot hold a token before
// obtaining one.
//
// No message in this file carries a password, a password hash, an API
// key digest, or signing key material. The one raw API key the service
// ever emits is returned exactly once, by IssueApiKey, and by nothing
// else (spec requirement "A raw API key is returned once and never
// again").
//
// Failures disclose nothing about other tenants or accounts: every
// credential failure is the same Unauthenticated result whatever its
// cause, and a resource in another tenant answers as though it did not
// exist (INV-10).
service IdentityService {
  // AuthenticateUser exchanges an email and password for a short-lived
  // token for one tenant, tied to no session. Deprecated for people — the
  // console signs in through AuthService.SignIn — and kept for machines
  // and harnesses (LLD-02 §6). Reachable without a token; throttled.
  rpc AuthenticateUser(AuthenticateUserRequest) returns (AuthenticateUserResponse);

  // ProvisionTenant creates a tenant. Its residency zone is fixed here
  // and cannot be changed afterwards.
  rpc ProvisionTenant(ProvisionTenantRequest) returns (ProvisionTenantResponse);

  // ProvisionPrincipal adds a person to a tenant by email (D-61). A new
  // email creates the person, with the given password or, without one,
  // an emailed invitation. An existing email adds a membership only and
  // the person keeps their own password. The response is the same either
  // way, so nothing reveals that the person already had an account.
  rpc ProvisionPrincipal(ProvisionPrincipalRequest) returns (ProvisionPrincipalResponse);

  // SetTenantStatus suspends or reactivates a tenant. Reversible, and it
  // never terminates a call already in progress (INV-03).
  rpc SetTenantStatus(SetTenantStatusRequest) returns (SetTenantStatusResponse);

  // SetPrincipalStatus disables or reactivates an account. Takes effect
  // on that account's next request, not at token expiry.
  rpc SetPrincipalStatus(SetPrincipalStatusRequest) returns (SetPrincipalStatusResponse);

  // GrantRole binds a role to a principal within a scope.
  rpc GrantRole(GrantRoleRequest) returns (GrantRoleResponse);

  // IssueApiKey creates a machine credential. Its response is the only
  // place the usable key value ever appears.
  rpc IssueApiKey(IssueApiKeyRequest) returns (IssueApiKeyResponse);

  // RevokeApiKey makes a key unusable immediately.
  rpc RevokeApiKey(RevokeApiKeyRequest) returns (RevokeApiKeyResponse);

  // ListAudit returns the calling tenant's most recent audit records.
  rpc ListAudit(ListAuditRequest) returns (ListAuditResponse);

  // ListPrincipals returns a page of a tenant's users, each with its
  // status and role bindings. No credential material is ever returned.
  rpc ListPrincipals(ListPrincipalsRequest) returns (ListPrincipalsResponse);

  // RevokeRole removes a role binding, under the same authority rules as
  // GrantRole. The last tenant administrator of a tenant cannot be
  // revoked, so no tenant is left without anyone able to administer it.
  rpc RevokeRole(RevokeRoleRequest) returns (RevokeRoleResponse);

  // ResetPrincipalPassword sets a temporary password a member must change
  // at their next sign-in, and ends their sessions (D-64). A tenant
  // administrator may reset only a person who belongs to no tenant they do
  // not administer; otherwise system scope is required.
  rpc ResetPrincipalPassword(ResetPrincipalPasswordRequest) returns (ResetPrincipalPasswordResponse);

  // SetUserStatus disables or restores a person in every tenant at once,
  // ending their sessions. System scope only: a tenant administrator
  // governs memberships (SetPrincipalStatus), never the person (D-61).
  rpc SetUserStatus(SetUserStatusRequest) returns (SetUserStatusResponse);
}

// TenantStatus mirrors the domain's tenant lifecycle.
enum TenantStatus {
  TENANT_STATUS_UNSPECIFIED = 0;
  TENANT_STATUS_ACTIVE = 1;
  TENANT_STATUS_SUSPENDED = 2;
}

// PrincipalStatus mirrors the domain's principal lifecycle.
enum PrincipalStatus {
  PRINCIPAL_STATUS_UNSPECIFIED = 0;
  PRINCIPAL_STATUS_ACTIVE = 1;
  PRINCIPAL_STATUS_DISABLED = 2;
}

// Tenant is a partner organisation.
message Tenant {
  string tenant_id = 1;
  string name = 2;
  TenantStatus status = 3;
  string residency_zone = 4;
  google.protobuf.Timestamp created_at = 5;
}

// Principal is a person's membership of one tenant (D-61). It carries no
// credential representation: there is deliberately no password or hash
// field here. status is the membership's, not the person's.
message Principal {
  string principal_id = 1;
  string tenant_id = 2;
  // Deprecated: usernames no longer exist. Filled with the email for
  // clients that still read it.
  string username = 3 [deprecated = true];
  string email = 4;
  string role = 5;
  PrincipalStatus status = 6;
  google.protobuf.Timestamp created_at = 7;
  // user_id identifies the person behind the membership.
  string user_id = 8;
  string display_name = 9;
}

message AuthenticateUserRequest {
  // tenant_id names the membership the token acts for: one person may be
  // a member of several tenants.
  string tenant_id = 1;
  // username is read as the person's email. The field keeps its name and
  // number for wire compatibility; usernames no longer exist (D-61).
  string username = 2;
  string password = 3;
}

message AuthenticateUserResponse {
  // token is credential material. Never log it, never store it.
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
  string tenant_id = 3;
  string principal_id = 4;
}

message ProvisionTenantRequest {
  string name = 1;
  string residency_zone = 2;
}

message ProvisionTenantResponse {
  Tenant tenant = 1;
}

message ProvisionPrincipalRequest {
  string tenant_id = 1;
  // Deprecated and ignored: the person is identified by email.
  string username = 2 [deprecated = true];
  string email = 3;
  // password is optional and never echoed back. Without it, a new person
  // is invited by email. It is never applied to a person who already has
  // an account.
  string password = 4;
  string role = 5;
  string display_name = 6;
}

message ProvisionPrincipalResponse {
  Principal principal = 1;
}

message SetTenantStatusRequest {
  string tenant_id = 1;
  TenantStatus status = 2;
}

message SetTenantStatusResponse {
  Tenant tenant = 1;
}

message SetPrincipalStatusRequest {
  string tenant_id = 1;
  string principal_id = 2;
  PrincipalStatus status = 3;
}

message SetPrincipalStatusResponse {
  Principal principal = 1;
}

message GrantRoleRequest {
  string tenant_id = 1;
  string principal_id = 2;
  string role = 3;
  // scope is "tenant" when omitted; "system" is platform-operator
  // authority and is not grantable by a tenant's own administrators.
  string scope = 4;
}

message GrantRoleResponse {}

message IssueApiKeyRequest {
  string tenant_id = 1;
  string principal_id = 2;
  // expires_at is optional; omitted means the key does not expire on its
  // own and must be revoked to stop working.
  google.protobuf.Timestamp expires_at = 3;
}

message IssueApiKeyResponse {
  string api_key_id = 1;
  // raw_key is the usable credential, returned here and nowhere else,
  // ever. Losing it means issuing a new key — it cannot be recovered
  // from what is stored.
  string raw_key = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message RevokeApiKeyRequest {
  string tenant_id = 1;
  string api_key_id = 2;
}

message RevokeApiKeyResponse {}

// AuditRecord is one immutable administrative mutation. Credential
// material is stripped before the record is written, so before_state and
// after_state never contain it.
message AuditRecord {
  int64 id = 1;
  string tenant_id = 2;
  string actor_id = 3;
  string actor_type = 4;
  string action = 5;
  string resource_type = 6;
  string resource_id = 7;
  string before_state_json = 8;
  string after_state_json = 9;
  google.protobuf.Timestamp created_at = 10;
}

message ListAuditRequest {
  string tenant_id = 1;
  // limit defaults to a server-chosen bound when zero. No cursor: a
  // partner needing pagination will say so, and guessing the shape now
  // freezes a contract nobody has asked for (D-25).
  int32 limit = 2;
}

message ListAuditResponse {
  repeated AuditRecord records = 1;
}

message RoleBinding {
  string role = 1;
  // "tenant" or "system".
  string scope = 2;
}

message ListedPrincipal {
  Principal principal = 1;
  repeated RoleBinding role_bindings = 2;
}

message ListPrincipalsRequest {
  string tenant_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListPrincipalsResponse {
  repeated ListedPrincipal principals = 1;
}

message RevokeRoleRequest {
  string tenant_id = 1;
  string principal_id = 2;
  string role = 3;
  // "tenant" when omitted.
  string scope = 4;
}

message RevokeRoleResponse {}

message ResetPrincipalPasswordRequest {
  string tenant_id = 1;
  string principal_id = 2;
  // The temporary password, chosen by the administrator and given to the
  // member out of band. Never echoed back.
  string temporary_password = 3;
}

message ResetPrincipalPasswordResponse {}

// UserStatus mirrors the domain's person lifecycle.
enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_ACTIVE = 1;
  USER_STATUS_DISABLED = 2;
}

message SetUserStatusRequest {
  string user_id = 1;
  UserStatus status = 2;
}

message SetUserStatusResponse {}
