[tools]
go = "1.26"
golangci-lint = "2.13.1"
buf = "1.72.0"
gotestsum = "1.13.0"
tilt = "0.37.8"
# Quality and supply-chain gates (D-71): SCA with the D-35 licence
# allowlist, secret scanning, and image scanning with SBOMs.
osv-scanner = "2.6.0"
gitleaks = "8.30.1"
trivy = "0.75.0"

[env]
GOFLAGS = "-mod=mod"

# All recipes live in the Makefile (single source of truth, D-60); these
# tasks are thin wrappers so `mise run <name>` keeps working and resolves
# the pinned toolchain above. Rationale comments live next to the recipes
# in the Makefile, not here.

[tasks.dev]
description = "Start the dev stack under plain compose, rebuilding images (refuses while Tilt runs; prefer tilt:up)"
run = "make dev"

[tasks."dev:down"]
description = "Stop and remove the local dev stack"
run = "make dev-down"

[tasks."dev:app"]
description = "Rebuild the app image and restart it under compose (refuses while Tilt runs; Tilt live-updates instead)"
run = "make dev-app"

[tasks."uat:auto"]
description = "Automated UAT: real baresip phones auto-answer the e2e call; asserts signaling, records, events, and bidirectional media, then restores the rig"
run = "make uat-auto"

[tasks."rig:restore"]
description = "Restore the dev rig between test tiers (Asterisk ARI, migrations, SIP fixtures)"
run = "make rig-restore"

[tasks."dev:logs"]
description = "Tail logs from the local dev stack"
run = "make dev-logs"

[tasks."tilt:up"]
description = "Start the dev loop under Tilt: Go live update, console on :5173, proto regeneration (UI :10350)"
run = "make tilt-up"

[tasks."tilt:down"]
description = "Stop the Tilt-managed dev stack"
run = "make tilt-down"

[tasks."tilt:ci"]
description = "Headless Tilt bring-up; exits 0 once all workloads are healthy (CI/E2E)"
run = "make tilt-ci"

[tasks.build]
description = "Build the Go binary to ./bin/atsap-api"
run = "make build"

[tasks.run]
description = "Run the Go app locally (expects Asterisk reachable, see .env)"
run = "make run"

[tasks.test]
description = "Run the Go test suite"
run = "make test"

[tasks.lint]
description = "Run golangci-lint (including tagged integration and e2e files)"
run = "make lint"

[tasks.proto]
description = "Lint protos and check for breaking changes against the integration branch"
run = "make proto"

[tasks.tidy]
description = "Tidy go modules"
run = "make tidy"

[tasks.docs]
description = "Run documentation wiring checks (HLD markers, decision refs, internal links)"
run = "make docs"

[tasks.diagrams]
description = "Render every mermaid diagram in docs/ and fail if one does not parse"
run = "make diagrams"

[tasks.vuln]
description = "Run govulncheck (pinned, matches CI GOVULNCHECK_VERSION) on the Go module"
run = "make vuln"

[tasks.ci]
description = "Run the full local CI gate in pipeline order (docs, lint, vuln, test)"
run = "make ci"

[tasks."docker:build"]
description = "Build production images for the app and Asterisk"
run = "make docker-build"

[tasks."images:push"]
description = "Build, tag and push the production images to REGISTRY (default: registry.example.com/atsap), tagged IMAGE_TAG (default: latest)"
run = "make images-push"

[tasks.deploy]
description = "Deploy the prod stack on this host from pre-built images (run on the VPS; see README's Production deployment section). Set REGISTRY/IMAGE_TAG as needed."
run = "make deploy"

[tasks."console:install"]
description = "Install the console's locked dependencies (npm ci)"
run = "make console-install"

[tasks."console:gen"]
description = "Regenerate the console's TypeScript API clients from api/proto"
run = "make console-gen"

[tasks."console:test"]
description = "Typecheck and run the console's component tests"
run = "make console-test"

[tasks."console:build"]
description = "Build the console for production into console/dist"
run = "make console-build"

[tasks."console:e2e"]
description = "Console browser E2E with the API mocked (Playwright, Chromium)"
run = "make console-e2e"

[tasks."console:integration"]
description = "Console against the real API on the Tilt rig"
run = "make console-integration"

[tasks."console:uat"]
description = "Console UAT: the HLD-18 user journeys on the Tilt rig"
run = "make console-uat"

[tasks."console:check"]
description = "Every console tier: unit and component, e2e, integration, UAT, audit"
run = "make console-check"

[tasks."console:audit"]
description = "Audit the console's production dependencies (high and above)"
run = "make console-audit"

[tasks."dev:user"]
description = "Create or reset a console login (dev@example.test, two Tenants) on the dev rig"
run = "make dev-user"
