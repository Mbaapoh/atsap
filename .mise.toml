[tools]
go = "1.25"
golangci-lint = "2.13.1"

[env]
GOFLAGS = "-mod=mod"

[tasks.dev]
description = "Start local dev stack (Asterisk + Go app) with live rebuild"
run = "docker compose -f deploy/docker-compose.yml up --build"

[tasks."dev:down"]
description = "Stop and remove the local dev stack"
run = "docker compose -f deploy/docker-compose.yml down"

[tasks."dev:app"]
description = "Rebuild and restart only the app service (fast; Asterisk is untouched)"
run = "docker compose -f deploy/docker-compose.yml up -d --build app"

[tasks."dev:logs"]
description = "Tail logs from the local dev stack"
run = "docker compose -f deploy/docker-compose.yml logs -f"

[tasks.build]
description = "Build the Go binary to ./bin/atsap-api"
dir = "api"
env = { CGO_ENABLED = "0" }
run = "go build -o ../bin/atsap-api ./cmd/atsap-api"

[tasks.run]
description = "Run the Go app locally (expects Asterisk reachable, see .env)"
dir = "api"
run = "go run ./cmd/atsap-api"

[tasks.test]
description = "Run the Go test suite"
dir = "api"
run = "go test ./... -race -cover"

[tasks.lint]
description = "Run golangci-lint"
dir = "api"
run = "golangci-lint run ./..."

[tasks.tidy]
description = "Tidy go modules"
dir = "api"
run = "go mod tidy"

[tasks.docs]
description = "Run documentation wiring checks (HLD markers, decision refs, internal links)"
run = "./scripts/check-docs.sh"

[tasks.vuln]
description = "Run govulncheck (pinned, matches CI GOVULNCHECK_VERSION) on the Go module"
dir = "api"
run = "go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./..."

[tasks.ci]
description = "Run the full local CI gate in Jenkins order (docs, lint, vuln, test)"
depends = ["docs", "lint", "vuln", "test"]

[tasks."docker:build"]
description = "Build production images for the app and Asterisk"
run = "docker build -t atsap-api:local api && docker build -t atsap-core:local core"

[tasks."images:push"]
description = "Build, tag and push the production images to REGISTRY (default: registry.example.com/atsap), tagged IMAGE_TAG (default: latest)"
run = '''
set -eu
: "${REGISTRY:=registry.example.com/atsap}"
: "${IMAGE_TAG:=latest}"
docker build -t "$REGISTRY/atsap-api:$IMAGE_TAG" api
docker build -t "$REGISTRY/atsap-core:$IMAGE_TAG" core
docker push "$REGISTRY/atsap-api:$IMAGE_TAG"
docker push "$REGISTRY/atsap-core:$IMAGE_TAG"
'''

[tasks.deploy]
description = "Deploy the prod stack on this host from pre-built images (run on the VPS; see README's Production deployment section). Set REGISTRY/IMAGE_TAG as needed."
run = "docker compose -f deploy/docker-compose.prod.yml pull && docker compose -f deploy/docker-compose.prod.yml up -d"
