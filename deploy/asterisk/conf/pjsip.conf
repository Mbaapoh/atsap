; Minimal PJSIP setup for local development: one UDP transport and one
; test endpoint (extension 1000) you can register a softphone against
; to place calls into the Stasis app defined in extensions.conf.

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[1000]
type = endpoint
context = stasis-in
disallow = all
allow = ulaw,alaw
auth = 1000
aors = 1000
direct_media = no

[1000]
type = auth
auth_type = userpass
username = 1000
password = devpassword123

[1000]
type = aor
max_contacts = 1
