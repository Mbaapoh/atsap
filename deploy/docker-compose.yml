services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: asterisk
      POSTGRES_USER: asterisk
      POSTGRES_PASSWORD: devpassword123
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asterisk -d asterisk"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - voip

  asterisk:
    build:
      context: ./asterisk
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "8088:8088/tcp"   # ARI / HTTP
      - "5038:5038/tcp"   # AMI
      - "10000-10200:10000-10200/udp" # RTP media
    volumes:
      - asterisk-data:/var/lib/asterisk
      - asterisk-logs:/var/log/asterisk
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - voip

  app:
    build:
      context: ..
      dockerfile: deploy/app/Dockerfile
    env_file:
      - ../.env
    environment:
      ARI_URL: http://asterisk:8088/ari
      AMI_ADDR: asterisk:5038
    ports:
      - "8080:8080"
    depends_on:
      - asterisk
    networks:
      - voip

networks:
  voip:

volumes:
  asterisk-data:
  asterisk-logs:
  postgres-data:
