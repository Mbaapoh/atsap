services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: asterisk
      POSTGRES_USER: asterisk
      POSTGRES_PASSWORD: devpassword123
    ports:
      # Host access for the api/ Go integration test suite (docs/TESTING.md),
      # which connects directly rather than through `docker compose exec`.
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asterisk -d asterisk"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - voip

  # NATS JetStream: durable domain-event bus for the transactional outbox
  # (event.call.* / event.participant.*). Consumed by the app from the
  # telephony-core walking skeleton onwards. Intentionally ephemeral
  # (no volume): durability lives in the Postgres outbox, NATS is the
  # transport — a NATS restart only delays delivery (INV-06), it never
  # loses events.
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222/tcp"   # client connections
      - "8222:8222/tcp"   # monitoring (optional, local debugging)
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8222/varz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - voip

  asterisk:
    build:
      context: ../core
    image: atsap-core:dev
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "8088:8088/tcp"   # ARI / HTTP
      - "5038:5038/tcp"   # AMI
      - "10000-10200:10000-10200/udp" # RTP media
    volumes:
      - asterisk-data:/var/lib/asterisk
      - asterisk-logs:/var/log/asterisk
    # NOTE: asterisk-data persists /var/lib/asterisk across image rebuilds.
    # After a major Asterisk version bump, delete it once
    # (docker volume rm deploy_asterisk-data) — stale xmldoc/astdb files
    # from the old version abort startup with "Stasis initialization
    # failed". Dev-only data; safe to drop.
    healthcheck:
      # Runs as the container's asterisk user; -rx exits non-zero while
      # Asterisk is still booting or wedged.
      test: ["CMD-SHELL", "asterisk -rx 'core show version' > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - voip

  # Auto-answer SIP UA sidecar (cmd/sip-ua): the answering party for the
  # telephony-core walking-skeleton e2e test (task 10.2). Registers as
  # the dev-fixture PJSIP endpoints 1000/1001 and answers every INVITE.
  # Runs as a container on the voip network, not on the host: ufw here
  # drops UDP from this bridge into host-published ports, so a
  # host-resident UA is never reachable by Asterisk's INVITE back
  # (design.md "UAs as sidecar container").
  sipua:
    build:
      context: ../api
      dockerfile: Dockerfile.sipua
    image: atsap-sipua:dev
    environment:
      SIP_SERVER: asterisk:5060
    restart: unless-stopped
    depends_on:
      - asterisk
    networks:
      - voip

  app:
    build:
      context: ../api
    image: atsap-api:dev
    env_file:
      - ../.env
    environment:
      ARI_URL: http://asterisk:8088/ari
      AMI_ADDR: asterisk:5038
    ports:
      - "8080:8080"
    # No healthcheck stanza yet: the image is distroless (no shell/curl),
    # so the probe must be a binary flag (e.g. atsap-api -check-ready
    # hitting /readyz). That flag lands with the main.go wiring in change
    # telephony-core-originate-bridge-hangup task 9.2; until then liveness
    # is the process being up and readiness is unwired by design.
    # Asterisk is deliberately service_started, not service_healthy: the
    # app's ARI/AMI reconnect loops tolerate its absence, and starting the
    # app regardless keeps /healthz debuggable while Asterisk boots.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      asterisk:
        condition: service_started
    networks:
      - voip

networks:
  voip:

volumes:
  asterisk-data:
  asterisk-logs:
  postgres-data:
