# gitleaks configuration (quality-and-supply-chain-gates, D-71).
#
# The default rules apply in full. The allowlist names exact synthetic
# fixture values only (D-39: tests use fabricated credentials, never real
# ones) — never whole files or directories, so a real secret added beside
# a fixture is still caught.

[extend]
useDefault = true

[[allowlists]]
description = "Synthetic test fixtures: fake licence tokens and a dummy digest"
regexTarget = "secret"
regexes = [
  # api/internal/licensing/rpc/handler_test.go: base64 of {"secret":"payload"} and "signature-bytes"
  '''^eyJzZWNyZXQiOiJwYXlsb2FkIn0\.c2lnbmF0dXJlLWJ5dGVz$''',
  # console/e2e/licence.spec.ts: base64 of "e2e-licence-key"
  '''^eyJhbGciOiJFZERTQSJ9\.ZTJlLWxpY2VuY2Uta2V5\.c2ln$''',
  # console/src/features/licence/licence.test.tsx: base64 of "secret-licence-payload" and "signature"
  '''^eyJhbGciOiJFZERTQSJ9\.c2VjcmV0LWxpY2VuY2UtcGF5bG9hZA\.c2lnbmF0dXJl$''',
  # api/internal/pbx/application/extension_cap_integration_test.go: a dummy secret digest
  '''^0123456789abcdef0123456789abcdef$''',
  # console/e2e/a1.spec.ts: base64 of "a1-journey-key"
  '''^eyJhbGciOiJFZERTQSJ9\.YTEtam91cm5leS1rZXk\.c2ln$''',
  # console/e2e/exposure.rig.spec.ts: base64 of {"exposure":"test"} and "exposure-key"
  '''^eyJleHBvc3VyZSI6InRlc3QifQ\.ZXhwb3N1cmUta2V5\.c2ln$''',
  # console/src/features/extensions/extensions.test.tsx: a made-up base32 SIP password
  '''^KZXW6YTBOI4TCMRTGQ2DKNRXHA4TS2LB$''',
  # Extension SIP usernames: an engine endpoint id, "e_" + 32 hex. Not a
  # secret by design — it is the username a phone presents, shown to the
  # administrator configuring it (pbx/domain/credential.go). The secret is
  # a separate value and stays fully scanned.
  '''^e_[0-9a-f]{32}$''',
]
