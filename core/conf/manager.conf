; Asterisk Manager Interface (AMI). Credentials here are for local
; development only (they must match AMI_USERNAME/AMI_PASSWORD in your
; .env). For production, ship a separate conf/ overlay with strong,
; unique credentials and restrict permit/deny to trusted hosts.
[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0

[voipapp]
secret = devpassword123
deny = 0.0.0.0/0.0.0.0
permit = 0.0.0.0/0.0.0.0
read = system,call,log,verbose,command,agent,user,dialplan
write = system,call,log,verbose,command,agent,user,dialplan
