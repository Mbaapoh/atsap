; Enables Asterisk's built-in HTTP server, required for ARI (both the
; REST endpoints and the /ari/events WebSocket).
[general]
enabled = yes
bindaddr = 0.0.0.0
bindport = 8088

; Asterisk's defaults here are sized for a handful of long-lived HTTP
; clients, and ARI is neither: every Stasis application holds a WebSocket,
; and every REST call is an HTTP session.
;
; sessionlimit defaults to 100, and a session is a THREAD. Observed
; 2026-09-09: the container sat at exactly 100 threads and stopped
; completing WebSocket handshakes — it accepted the TCP connection and
; never answered, so callers saw a timeout that named neither Asterisk nor
; HTTP. New Stasis applications simply could not register.
;
; The limit is raised rather than removed: unbounded would trade a clear
; failure for memory exhaustion. 500 leaves room for the platform, its
; reconnects, and a full e2e suite without approaching it.
sessionlimit = 500

; How long an idle session is held before Asterisk reclaims it. The
; default (30s) is long when sessions are the scarce resource; a client
; that has gone away should not hold a thread for half a minute.
session_inactivity = 10000

; Keep-alive window for a session awaiting its first request. Shorter
; than the default for the same reason.
session_keep_alive = 5000
