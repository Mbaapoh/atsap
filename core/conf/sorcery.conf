; Tells res_pjsip where to find each kind of object (DECISIONS D-47).
;
; READ THIS BEFORE EDITING.
;
; The three `config,pjsip.conf` lines are NOT redundant and must not be
; removed as tidying. Adding a realtime wizard REPLACES the default
; config-file wizard rather than supplementing it: without these lines the
; dev fixtures 1000 and 1001 in pjsip.conf disappear from Asterisk
; entirely, and telephony-core's walking-skeleton end-to-end test — which
; dials them — breaks with no obvious connection to this file.
;
; Observed during the D-47 spike. It is the single most likely way to get
; this configuration wrong, and the failure looks like a broken test in a
; different bounded context.
;
; Order matters: wizards are consulted in the order listed, so the static
; fixtures resolve first and the database is asked only for what the file
; does not define.
[res_pjsip]
endpoint=config,pjsip.conf,criteria=type=endpoint
endpoint=realtime,ps_endpoints
auth=config,pjsip.conf,criteria=type=auth
auth=realtime,ps_auths
aor=config,pjsip.conf,criteria=type=aor
aor=realtime,ps_aors

; Contacts are dynamic and written by Asterisk itself, so there is no
; config-file wizard to preserve. Mapping them to realtime is what makes
; registration state readable by the platform — the console's
; registered/not-registered badge is a query against this table (LLD-03
; §4.4). Left unmapped, contacts live in node-local astdb where nothing
; outside Asterisk can see them.
contact=realtime,ps_contacts
