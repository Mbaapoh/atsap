; Maps Asterisk's realtime object families onto the projection tables in
; the atsapbx database (DECISIONS D-47).
;
; Syntax: <family> => <driver>,<database>,<table>
;
; All FOUR are mapped, and ps_contacts is not optional. Omitting it does
; not fail loudly: a REGISTER still returns 200 OK while the contact
; fails to bind, so the device believes it is registered and nothing can
; call it. Observed during the D-47 spike; it is the worst failure mode in
; this file because a test asserting "REGISTER returns 200" passes.
;
; The first three we write and the engine reads. ps_contacts is the other
; way round — Asterisk creates a row per registration and prunes it on
; expiry — which is why it is the one table the engine has write access
; to.
[settings]
ps_endpoints => pgsql,atsapbx,ps_endpoints
ps_auths => pgsql,atsapbx,ps_auths
ps_aors => pgsql,atsapbx,ps_aors
ps_contacts => pgsql,atsapbx,ps_contacts
