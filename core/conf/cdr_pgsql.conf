; Logs CDRs to Postgres instead of (or in addition to) the CSV backend.
; Credentials here are for local development only and must match the
; `postgres` service in deploy/docker-compose.yml. For production, ship a
; separate conf.prod/cdr_pgsql.conf pointing at your real database.
[global]
hostname=postgres
port=5432
dbname=asterisk
user=asterisk
password=devpassword123
table=cdr
