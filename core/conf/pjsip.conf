; Minimal PJSIP setup for local development: one UDP transport and two
; test endpoints (extensions 1000 and 1001) you can register softphones
; against to place calls into the Stasis app defined in extensions.conf.
;
; 1000/1001 are the telephony-core walking-skeleton's dev-test fixtures
; (openspec/changes/telephony-core-originate-bridge-hangup/proposal.md,
; task 9.1) — static config, not the real pbx-core Extension feature
; (dynamic, DB-backed provisioning, LLD-03). Do not add more endpoints
; here for anything beyond this walking skeleton's own testing.

; Endpoint identification order (pbx-inbound-and-emergency design D5):
; username before ip. Carrier trunks are recognized by source IP through
; realtime identify rows — but every device on this host (softphones, the
; e2e/UAT agents, a phone behind the same NAT address as a carrier)
; shares one source IP with them. Matching the From username first keeps
; an authenticated device on its own endpoint; the IP match then catches
; exactly what it should: unauthenticated carrier signalling that names
; no endpoint of ours. Without this, a trunk's identify row swallows its
; own tenant's phones (observed: REGISTER from the dev host matched the
; trunk and failed 404).
[global]
type = global
endpoint_identifier_order = username,ip,anonymous

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[1000]
type = endpoint
context = stasis-in
disallow = all
allow = ulaw,alaw
auth = 1000
aors = 1000
direct_media = no

[1000]
type = auth
auth_type = userpass
username = 1000
password = devpassword123

[1000]
type = aor
max_contacts = 1
; A fresh REGISTER always replaces a stale contact rather than being
; rejected with 403 "exceed max contacts" — the dev-fixture answering
; party (cmd/sip-ua) is a container whose IP changes on every
; recreate, and asterisk-data (the persistent volume) otherwise keeps
; the old contact around until its registration naturally expires.
remove_existing = yes

[1001]
type = endpoint
context = stasis-in
disallow = all
allow = ulaw,alaw
auth = 1001
aors = 1001
direct_media = no

[1001]
type = auth
auth_type = userpass
username = 1001
password = devpassword123

[1001]
type = aor
max_contacts = 1
remove_existing = yes
