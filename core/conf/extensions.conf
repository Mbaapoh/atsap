; Dialplan: hands every call off to the Go app's Stasis application
; ("voip-app", matching ARI_APP_NAME) instead of handling it in the
; dialplan itself. Call control (answer, play, bridge, hangup) happens
; from Go over ARI.

[stasis-in]
exten => _X.,1,NoOp(Handing off ${EXTEN} to ARI app)
 same => n,Stasis(voip-app)
 same => n,Hangup()

; Carriers present DIDs in E.164 with a leading + (design D7 matches it
; with the + ignored). _X. does not match +, so without this a +DID
; never reaches Stasis and the caller gets "extension not found".
exten => _+X.,1,NoOp(Handing off ${EXTEN} to ARI app)
 same => n,Stasis(voip-app)
 same => n,Hangup()
