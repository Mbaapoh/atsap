; PostgreSQL Realtime driver: how Asterisk reads the PJSIP configuration
; the platform projects for it (DECISIONS D-47).
;
; NOTE the database. This is `atsapbx`, the APPLICATION database — not the
; `asterisk` CDR/CEL database that cdr_pgsql.conf next door points at.
; They are different databases on the same server and mixing them up is
; the easiest mistake to make here.
;
; The engine connects as `asterisk_engine`, a role created by the Postgres
; bootstrap script (deploy/postgres/init/02-atsapbx.sql) and granted, by
; api/migrations/0004, SELECT on exactly ps_endpoints, ps_auths and
; ps_aors plus write access to ps_contacts — and nothing else, ever. It
; cannot read extensions, principals, calls or any other tenant data, and
; a test asserts those reads fail with insufficient_privilege.
;
; Credentials here are local-development only and must match the
; `postgres` service in deploy/docker-compose.yml. Production ships a
; separate conf.prod/res_pgsql.conf with real ones.
[general]
dbhost=postgres
dbport=5432
dbname=atsapbx
dbuser=asterisk_engine
dbpass=devpassword123

; `warn` rather than `createchar`/`createclose`: the schema is owned by
; api/migrations, and an engine that can alter it is an engine that can
; disagree with the migration that defines it. A column mismatch is a
; warning to fix in a migration, never a table Asterisk quietly reshapes.
requirements=warn
