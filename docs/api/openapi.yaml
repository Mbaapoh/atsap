             returned.
        channelLimit:
          type: integer
          title: channel_limit
          format: int32
        priority:
          type: integer
          title: priority
          format: int32
          description: Lower is preferred.
        health:
          title: health
          $ref: '#/components/schemas/atsapbx.v1.TrunkHealth'
      title: Trunk
      additionalProperties: false
      description: |-
        Trunk is what a caller sees of a carrier connection. It carries no
         secret and no engine object of any kind.
