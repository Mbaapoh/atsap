          title: secret
          description: The new secret, returned exactly once, as at creation.
      title: RegenerateSecretResponse
      additionalProperties: false
    atsapbx.v1.Route:
      type: object
      properties:
        routeId:
          type: string
          title: route_id
        prefixPattern:
          type: string
          title: prefix_pattern
          description: |-
            An optional leading + then digits and X (any one digit), e.g. "44",
             "+1", "447X". Not an expression language.
        trunkId:
          type: string
          title: trunk_id
        costPerMinuteMicros:
          type:
            - integer
            - string
          title: cost_per_minute_micros
          format: int64
          description: |-
            Stored cost in millionths of the currency unit per minute. Used only
             to break ties; it is not a rating model.
        priority:
          type: integer
          title: priority
          format: int32
          description: Lower wins among patterns of equal length.
