      title: GetCallResponse
      additionalProperties: false
    atsapbx.v1.ListCallsRequest:
      type: object
      properties:
        tenantId:
          type: string
          title: tenant_id
        limit:
          type: integer
          title: limit
          format: int32
        offset:
          type: integer
          title: offset
          format: int32
        state:
          type: string
          title: state
          description: Optional filters; empty means "any".
        direction:
          type: string
          title: direction
        startedFrom:
          title: started_from
          description: Calls started in [started_from, started_to).
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        startedTo:
          title: started_to
          $ref: '#/components/schemas/google.protobuf.Timestamp'
