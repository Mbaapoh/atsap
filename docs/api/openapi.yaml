          description: |-
            state is one of: Initiated, Screening, Routing, Presenting, Active,
             Degraded, Terminating, Terminated (docs/telephony/domain.CallState).
        direction:
          type: string
          title: direction
          description: 'direction is one of: INBOUND, OUTBOUND, INTERNAL.'
        sourceNumber:
          type: string
          title: source_number
        destNumber:
          type: string
          title: dest_number
        participants:
