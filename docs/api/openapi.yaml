              $ref: '#/components/schemas/atsapbx.v1.ListInboundNumbersRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/atsapbx.v1.ListInboundNumbersResponse'
  /atsapbx.v1.PbxService/DeleteInboundNumber:
    post:
      tags:
        - atsapbx.v1.PbxService
      summary: DeleteInboundNumber
      description: |-
        DeleteInboundNumber releases an inbound number. The extension keeps
         working; only the public number stops ringing it.
      operationId: atsapbx.v1.PbxService.DeleteInboundNumber
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/atsapbx.v1.DeleteInboundNumberRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/atsapbx.v1.DeleteInboundNumberResponse'
  /atsapbx.v1.TelephonyService/GetCall:
    post:
      tags:
        - atsapbx.v1.TelephonyService
      summary: GetCall
      description: GetCall returns a Call's current state and participants.
      operationId: atsapbx.v1.TelephonyService.GetCall
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/atsapbx.v1.GetCallRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/atsapbx.v1.GetCallResponse'
  /atsapbx.v1.TelephonyService/ListCalls:
    post:
      tags:
        - atsapbx.v1.TelephonyService
      summary: ListCalls
      description: |-
        ListCalls returns the tenant's calls, newest first, page by page —
         the console's read-only call history (HLD-18 flow A5). Entries carry
         platform fields only: never a channel, bridge or engine identifier.
         Rich call detail and reporting are LLD-09's.
      operationId: atsapbx.v1.TelephonyService.ListCalls
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/atsapbx.v1.ListCallsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/atsapbx.v1.ListCallsResponse'
