openapi: 3.1.0
info: {}
paths:
  /atsapbx.v1.AuthService/DiscoverSignIn:
    post:
      tags:
        - atsapbx.v1.AuthService
      summary: DiscoverSignIn
      description: |-
        DiscoverSignIn returns how an email signs in: a password today, or
         the tenant's identity provider once SSO is built (D-63).
      operationId: atsapbx.v1.AuthService.DiscoverSignIn
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/atsapbx.v1.DiscoverSignInRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/atsapbx.v1.DiscoverSignInResponse'
  /atsapbx.v1.AuthService/SignIn:
    post:
      tags:
        - atsapbx.v1.AuthService
      summary: SignIn
      description: |-
        SignIn checks an email and password and starts a session. Repeated
         failures are throttled (RESOURCE_EXHAUSTED, with a retry delay).
      operationId: atsapbx.v1.AuthService.SignIn
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/atsapbx.v1.SignInRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/atsapbx.v1.SignInResponse'
  /atsapbx.v1.AuthService/RefreshSession:
    post:
      tags:
        - atsapbx.v1.AuthService
      summary: RefreshSession
      description: |-
        RefreshSession rotates the session's refresh secret and issues an
         access token — for tenant_id when given. Choosing or switching tenant
         is a refresh. A replayed secret ends the session.
      operationId: atsapbx.v1.AuthService.RefreshSession
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/atsapbx.v1.RefreshSessionRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/atsapbx.v1.RefreshSessionResponse'
  /atsapbx.v1.AuthService/SignOut:
    post:
      tags:
        - atsapbx.v1.AuthService
      summary: SignOut
      description: SignOut ends the session. Its access tokens stop working at once.
      operationId: atsapbx.v1.AuthService.SignOut
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/atsapbx.v1.SignOutRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/atsapbx.v1.SignOutResponse'
  /atsapbx.v1.AuthService/ChangePassword:
    post:
      tags:
        - atsapbx.v1.AuthService
      summary: ChangePassword
      description: |-
        ChangePassword needs the current password, and ends every other
         session of the person. It is the one call a must-change token may make
         besides SignOut.
      operationId: atsapbx.v1.AuthService.ChangePassword
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/atsapbx.v1.ChangePasswordRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/atsapbx.v1.ChangePasswordResponse'
  /atsapbx.v1.AuthService/RequestPasswordReset:
    post:
      tags:
        - atsapbx.v1.AuthService
      summary: RequestPasswordReset
      description: |-
        RequestPasswordReset emails a single-use link, valid for 30 minutes,
         when the email may sign in with a password. Always the same answer.
      operationId: atsapbx.v1.AuthService.RequestPasswordReset
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/atsapbx.v1.RequestPasswordResetRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/atsapbx.v1.RequestPasswordResetResponse'
  /atsapbx.v1.AuthService/CompletePasswordReset:
    post:
      tags:
        - atsapbx.v1.AuthService
      summary: CompletePasswordReset
      description: |-
        CompletePasswordReset redeems a reset or invitation link's secret,
         sets the password, and ends every session of the person.
      operationId: atsapbx.v1.AuthService.CompletePasswordReset
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/atsapbx.v1.CompletePasswordResetRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/atsapbx.v1.CompletePasswordResetResponse'
  /atsapbx.v1.IdentityService/AuthenticateUser:
    post:
      tags:
        - atsapbx.v1.IdentityService
      summary: AuthenticateUser
      description: |-
        AuthenticateUser exchanges an email and password for a short-lived
         token for one tenant, tied to no session. Deprecated for people — the
         console signs in through AuthService.SignIn — and kept for machines
         and harnesses (LLD-02 §6). Reachable without a token; throttled.
      operationId: atsapbx.v1.IdentityService.AuthenticateUser
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/atsapbx.v1.AuthenticateUserRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/atsapbx.v1.AuthenticateUserResponse'
  /atsapbx.v1.IdentityService/ProvisionTenant:
    post:
      tags:
        - atsapbx.v1.IdentityService
      summary: ProvisionTenant
      description: |-
        ProvisionTenant creates a tenant. Its residency zone is fixed here
         and cannot be changed afterwards.
      operationId: atsapbx.v1.IdentityService.ProvisionTenant
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/atsapbx.v1.ProvisionTenantRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/atsapbx.v1.ProvisionTenantResponse'
  /atsapbx.v1.IdentityService/ProvisionPrincipal:
    post:
      tags:
        - atsapbx.v1.IdentityService
      summary: ProvisionPrincipal
      description: |-
        ProvisionPrincipal adds a person to a tenant by email (D-61). A new
         email creates the person, with the given password or, without one,
         an emailed invitation. An existing email adds a membership only and
         the person keeps their own password. The response is the same either
         way, so nothing reveals that the person already had an account.
      operationId: atsapbx.v1.IdentityService.ProvisionPrincipal
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/atsapbx.v1.ProvisionPrincipalRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/atsapbx.v1.ProvisionPrincipalResponse'
  /atsapbx.v1.IdentityService/SetTenantStatus:
    post:
      tags:
        - atsapbx.v1.IdentityService
      summary: SetTenantStatus
      description: |-
        SetTenantStatus suspends or reactivates a tenant. Reversible, and it
         never terminates a call already in progress (INV-03).
      operationId: atsapbx.v1.IdentityService.SetTenantStatus
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/atsapbx.v1.SetTenantStatusRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/atsapbx.v1.SetTenantStatusResponse'
  /atsapbx.v1.IdentityService/SetPrincipalStatus:
    post:
      tags:
        - atsapbx.v1.IdentityService
      summary: SetPrincipalStatus
      description: |-
        SetPrincipalStatus disables or reactivates an account. Takes effect
         on that account's next request, not at token expiry.
      operationId: atsapbx.v1.IdentityService.SetPrincipalStatus
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/atsapbx.v1.SetPrincipalStatusRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/atsapbx.v1.SetPrincipalStatusResponse'
  /atsapbx.v1.IdentityService/GrantRole:
    post:
      tags:
        - atsapbx.v1.IdentityService
      summary: GrantRole
      description: GrantRole binds a role to a principal within a scope.
      operationId: atsapbx.v1.IdentityService.GrantRole
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/atsapbx.v1.GrantRoleRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/atsapbx.v1.GrantRoleResponse'
  /atsapbx.v1.IdentityService/IssueApiKey:
    post:
      tags:
        - atsapbx.v1.IdentityService
      summary: IssueApiKey
      description: |-
        IssueApiKey creates a machine credential. Its response is the only
         place the usable key value ever appears.
      operationId: atsapbx.v1.IdentityService.IssueApiKey
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/atsapbx.v1.IssueApiKeyRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/atsapbx.v1.IssueApiKeyResponse'
  /atsapbx.v1.IdentityService/RevokeApiKey:
    post:
      tags:
        - atsapbx.v1.IdentityService
      summary: RevokeApiKey
      description: RevokeApiKey makes a key unusable immediately.
      operationId: atsapbx.v1.IdentityService.RevokeApiKey
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/atsapbx.v1.RevokeApiKeyRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/atsapbx.v1.RevokeApiKeyResponse'
  /atsapbx.v1.IdentityService/ListAudit:
    post:
      tags:
        - atsapbx.v1.IdentityService
      summary: ListAudit
      description: ListAudit returns the calling tenant's most recent audit records.
      operationId: atsapbx.v1.IdentityService.ListAudit
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/atsapbx.v1.ListAuditRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/atsapbx.v1.ListAuditResponse'
  /atsapbx.v1.IdentityService/ListPrincipals:
    post:
      tags:
        - atsapbx.v1.IdentityService
      summary: ListPrincipals
      description: |-
        ListPrincipals returns a page of a tenant's users, each with its
         status and role bindings. No credential material is ever returned.
      operationId: atsapbx.v1.IdentityService.ListPrincipals
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/atsapbx.v1.ListPrincipalsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/atsapbx.v1.ListPrincipalsResponse'
  /atsapbx.v1.IdentityService/RevokeRole:
    post:
      tags:
        - atsapbx.v1.IdentityService
      summary: RevokeRole
      description: |-
        RevokeRole removes a role binding, under the same authority rules as
         GrantRole. The last tenant administrator of a tenant cannot be
         revoked, so no tenant is left without anyone able to administer it.
      operationId: atsapbx.v1.IdentityService.RevokeRole
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/atsapbx.v1.RevokeRoleRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/atsapbx.v1.RevokeRoleResponse'
  /atsapbx.v1.IdentityService/ResetPrincipalPassword:
    post:
      tags:
        - atsapbx.v1.IdentityService
      summary: ResetPrincipalPassword
      description: |-
        ResetPrincipalPassword sets a temporary password a member must change
         at their next sign-in, and ends their sessions (D-64). A tenant
         administrator may reset only a person who belongs to no tenant they do
         not administer; otherwise system scope is required.
      operationId: atsapbx.v1.IdentityService.ResetPrincipalPassword
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/atsapbx.v1.ResetPrincipalPasswordRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/atsapbx.v1.ResetPrincipalPasswordResponse'
  /atsapbx.v1.IdentityService/SetUserStatus:
    post:
      tags:
        - atsapbx.v1.IdentityService
      summary: SetUserStatus
      description: |-
        SetUserStatus disables or restores a person in every tenant at once,
         ending their sessions. System scope only: a tenant administrator
         governs memberships (SetPrincipalStatus), never the person (D-61).
      operationId: atsapbx.v1.IdentityService.SetUserStatus
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/atsapbx.v1.SetUserStatusRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/atsapbx.v1.SetUserStatusResponse'
  /atsapbx.v1.LicensingService/GetLicenseStatus:
    post:
      tags:
        - atsapbx.v1.LicensingService
      summary: GetLicenseStatus
      description: |-
        GetLicenseStatus returns the licence in force. Any authenticated
         caller may read it: the console header shows it to every user.
      operationId: atsapbx.v1.LicensingService.GetLicenseStatus
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/atsapbx.v1.GetLicenseStatusRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/atsapbx.v1.GetLicenseStatusResponse'
  /atsapbx.v1.LicensingService/ApplyLicenseKey:
    post:
      tags:
        - atsapbx.v1.LicensingService
      summary: ApplyLicenseKey
      description: |-
        ApplyLicenseKey applies a signed licence token. It requires
         installation-wide (system-scope) authority. A token that verifies
         takes effect at once, with no restart and no call interrupted; one
         that does not is refused and the licence in force is untouched.
      operationId: atsapbx.v1.LicensingService.ApplyLicenseKey
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/atsapbx.v1.ApplyLicenseKeyRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/atsapbx.v1.ApplyLicenseKeyResponse'
  /atsapbx.v1.PbxService/CreateExtension:
    post:
      tags:
        - atsapbx.v1.PbxService
      summary: CreateExtension
      description: |-
        CreateExtension provisions an extension and makes it registrable by
         a device. No apply step follows: it is live when this returns.
      operationId: atsapbx.v1.PbxService.CreateExtension
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
