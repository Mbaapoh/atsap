    google.protobuf.Timestamp:
      type: string
      examples:
        - 1s
        - 1.000340012s
      format: date-time
      description: |-
        A Timestamp represents a point in time independent of any time zone or local
         calendar, encoded as a count of seconds and fractions of seconds at
         nanosecond resolution. The count is relative to an epoch at UTC midnight on
         January 1, 1970, in the proleptic Gregorian calendar which extends the
         Gregorian calendar backwards to year one.

         All minutes are 60 seconds long. Leap seconds are "smeared" so that no leap
         second table is needed for interpretation, using a [24-hour linear
         smear](https://developers.google.com/time/smear).

         The range is from 0001-01-01T00:00:00Z to 9999-12-31T23:59:59.999999999Z. By
         restricting to that range, we ensure that we can convert to and from [RFC
         3339](https://www.ietf.org/rfc/rfc3339.txt) date strings.

         # Examples

         Example 1: Compute Timestamp from POSIX `time()`.

             Timestamp timestamp;
             timestamp.set_seconds(time(NULL));
             timestamp.set_nanos(0);

         Example 2: Compute Timestamp from POSIX `gettimeofday()`.

             struct timeval tv;
             gettimeofday(&tv, NULL);

             Timestamp timestamp;
             timestamp.set_seconds(tv.tv_sec);
             timestamp.set_nanos(tv.tv_usec * 1000);

         Example 3: Compute Timestamp from Win32 `GetSystemTimeAsFileTime()`.

             FILETIME ft;
             GetSystemTimeAsFileTime(&ft);
             UINT64 ticks = (((UINT64)ft.dwHighDateTime) << 32) | ft.dwLowDateTime;

             // A Windows tick is 100 nanoseconds. Windows epoch 1601-01-01T00:00:00Z
             // is 11644473600 seconds before Unix epoch 1970-01-01T00:00:00Z.
             Timestamp timestamp;
             timestamp.set_seconds((INT64) ((ticks / 10000000) - 11644473600LL));
             timestamp.set_nanos((INT32) ((ticks % 10000000) * 100));

         Example 4: Compute Timestamp from Java `System.currentTimeMillis()`.

             long millis = System.currentTimeMillis();

             Timestamp timestamp = Timestamp.newBuilder().setSeconds(millis / 1000)
                 .setNanos((int) ((millis % 1000) * 1000000)).build();

         Example 5: Compute Timestamp from Java `Instant.now()`.

             Instant now = Instant.now();

             Timestamp timestamp =
                 Timestamp.newBuilder().setSeconds(now.getEpochSecond())
                     .setNanos(now.getNano()).build();

         Example 6: Compute Timestamp from current time in Python.

             timestamp = Timestamp()
             timestamp.GetCurrentTime()

         # JSON Mapping

         In JSON format, the Timestamp type is encoded as a string in the
         [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format. That is, the
         format is "{year}-{month}-{day}T{hour}:{min}:{sec}[.{frac_sec}]Z"
         where {year} is always expressed using four digits while {month}, {day},
         {hour}, {min}, and {sec} are zero-padded to two digits each. The fractional
         seconds, which can go up to 9 digits (i.e. up to 1 nanosecond resolution),
         are optional. The "Z" suffix indicates the timezone ("UTC"); the timezone
         is required. A proto3 JSON serializer should always use UTC (as indicated by
         "Z") when printing the Timestamp type and a proto3 JSON parser should be
         able to accept both UTC and other timezones (as indicated by an offset).

         For example, "2017-01-15T01:30:15.01Z" encodes 15.01 seconds past
         01:30 UTC on January 15, 2017.

         In JavaScript, one can convert a Date object to this format using the
         standard
         [toISOString()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Date/toISOString)
         method. In Python, a standard `datetime.datetime` object can be converted
         to this format using
         [`strftime`](https://docs.python.org/2/library/time.html#time.strftime) with
         the time format spec '%Y-%m-%dT%H:%M:%S.%fZ'. Likewise, in Java, one can use
         the Joda Time's [`ISODateTimeFormat.dateTime()`](
         http://joda-time.sourceforge.net/apidocs/org/joda/time/format/ISODateTimeFormat.html#dateTime()
         ) to obtain a formatter capable of generating timestamps in this format.
    connect-protocol-version:
      type: number
      title: Connect-Protocol-Version
      enum:
        - 1
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        detail:
          $ref: '#/components/schemas/google.protobuf.Any'
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    google.protobuf.Any:
      type: object
      properties:
        type:
          type: string
        value:
          type: string
          format: binary
        debug:
          type: object
          additionalProperties: true
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message.
    atsapbx.v1.PrincipalStatus:
      type: string
      title: PrincipalStatus
      enum:
        - PRINCIPAL_STATUS_UNSPECIFIED
        - PRINCIPAL_STATUS_ACTIVE
        - PRINCIPAL_STATUS_DISABLED
      description: PrincipalStatus mirrors the domain's principal lifecycle.
    atsapbx.v1.TenantStatus:
      type: string
      title: TenantStatus
      enum:
        - TENANT_STATUS_UNSPECIFIED
        - TENANT_STATUS_ACTIVE
        - TENANT_STATUS_SUSPENDED
      description: TenantStatus mirrors the domain's tenant lifecycle.
    atsapbx.v1.UserStatus:
      type: string
      title: UserStatus
      enum:
        - USER_STATUS_UNSPECIFIED
        - USER_STATUS_ACTIVE
        - USER_STATUS_DISABLED
      description: UserStatus mirrors the domain's person lifecycle.
    atsapbx.v1.AuditRecord:
      type: object
      properties:
        id:
          type:
            - integer
            - string
          title: id
          format: int64
        tenantId:
          type: string
          title: tenant_id
        actorId:
          type: string
          title: actor_id
        actorType:
          type: string
          title: actor_type
        action:
          type: string
          title: action
        resourceType:
          type: string
          title: resource_type
        resourceId:
          type: string
          title: resource_id
        beforeStateJson:
          type: string
          title: before_state_json
        afterStateJson:
          type: string
          title: after_state_json
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: AuditRecord
      additionalProperties: false
      description: |-
        AuditRecord is one immutable administrative mutation. Credential
         material is stripped before the record is written, so before_state and
         after_state never contain it.
    atsapbx.v1.AuthenticateUserRequest:
      type: object
      properties:
        tenantId:
          type: string
          title: tenant_id
          description: |-
            tenant_id names the membership the token acts for: one person may be
             a member of several tenants.
        username:
          type: string
          title: username
          description: |-
            username is read as the person's email. The field keeps its name and
             number for wire compatibility; usernames no longer exist (D-61).
        password:
          type: string
          title: password
      title: AuthenticateUserRequest
      additionalProperties: false
    atsapbx.v1.AuthenticateUserResponse:
      type: object
      properties:
        token:
          type: string
          title: token
          description: token is credential material. Never log it, never store it.
        expiresAt:
          title: expires_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        tenantId:
          type: string
          title: tenant_id
        principalId:
          type: string
          title: principal_id
      title: AuthenticateUserResponse
      additionalProperties: false
    atsapbx.v1.GrantRoleRequest:
      type: object
      properties:
        tenantId:
          type: string
          title: tenant_id
        principalId:
          type: string
          title: principal_id
        role:
          type: string
          title: role
        scope:
          type: string
          title: scope
          description: |-
            scope is "tenant" when omitted; "system" is platform-operator
             authority and is not grantable by a tenant's own administrators.
      title: GrantRoleRequest
      additionalProperties: false
    atsapbx.v1.GrantRoleResponse:
      type: object
      title: GrantRoleResponse
      additionalProperties: false
    atsapbx.v1.IssueApiKeyRequest:
      type: object
      properties:
        tenantId:
          type: string
          title: tenant_id
        principalId:
          type: string
          title: principal_id
        expiresAt:
          title: expires_at
          description: |-
            expires_at is optional; omitted means the key does not expire on its
             own and must be revoked to stop working.
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: IssueApiKeyRequest
      additionalProperties: false
    atsapbx.v1.IssueApiKeyResponse:
      type: object
      properties:
        apiKeyId:
          type: string
          title: api_key_id
        rawKey:
          type: string
          title: raw_key
          description: |-
            raw_key is the usable credential, returned here and nowhere else,
             ever. Losing it means issuing a new key — it cannot be recovered
             from what is stored.
        expiresAt:
          title: expires_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: IssueApiKeyResponse
      additionalProperties: false
    atsapbx.v1.ListAuditRequest:
      type: object
      properties:
        tenantId:
          type: string
          title: tenant_id
        limit:
          type: integer
          title: limit
          format: int32
          description: |-
            limit defaults to a server-chosen bound when zero. No cursor: a
             partner needing pagination will say so, and guessing the shape now
             freezes a contract nobody has asked for (D-25).
      title: ListAuditRequest
      additionalProperties: false
    atsapbx.v1.ListAuditResponse:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/atsapbx.v1.AuditRecord'
          title: records
      title: ListAuditResponse
      additionalProperties: false
    atsapbx.v1.ListPrincipalsRequest:
      type: object
      properties:
        tenantId:
          type: string
          title: tenant_id
        limit:
          type: integer
          title: limit
          format: int32
        offset:
          type: integer
          title: offset
          format: int32
      title: ListPrincipalsRequest
      additionalProperties: false
    atsapbx.v1.ListPrincipalsResponse:
      type: object
      properties:
        principals:
          type: array
          items:
            $ref: '#/components/schemas/atsapbx.v1.ListedPrincipal'
          title: principals
      title: ListPrincipalsResponse
      additionalProperties: false
    atsapbx.v1.ListedPrincipal:
      type: object
      properties:
        principal:
          title: principal
          $ref: '#/components/schemas/atsapbx.v1.Principal'
        roleBindings:
          type: array
          items:
            $ref: '#/components/schemas/atsapbx.v1.RoleBinding'
          title: role_bindings
      title: ListedPrincipal
      additionalProperties: false
    atsapbx.v1.Principal:
      type: object
      properties:
        principalId:
          type: string
          title: principal_id
        tenantId:
          type: string
          title: tenant_id
        username:
          type: string
          title: username
          description: |-
            Deprecated: usernames no longer exist. Filled with the email for
             clients that still read it.
          deprecated: true
        email:
          type: string
          title: email
        role:
          type: string
          title: role
        status:
          title: status
          $ref: '#/components/schemas/atsapbx.v1.PrincipalStatus'
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        userId:
          type: string
          title: user_id
          description: user_id identifies the person behind the membership.
        displayName:
          type: string
          title: display_name
      title: Principal
      additionalProperties: false
      description: |-
        Principal is a person's membership of one tenant (D-61). It carries no
         credential representation: there is deliberately no password or hash
         field here. status is the membership's, not the person's.
    atsapbx.v1.ProvisionPrincipalRequest:
      type: object
      properties:
        tenantId:
          type: string
          title: tenant_id
        username:
          type: string
          title: username
          description: 'Deprecated and ignored: the person is identified by email.'
          deprecated: true
        email:
          type: string
          title: email
        password:
          type: string
          title: password
          description: |-
            password is optional and never echoed back. Without it, a new person
             is invited by email. It is never applied to a person who already has
             an account.
        role:
          type: string
          title: role
        displayName:
          type: string
          title: display_name
      title: ProvisionPrincipalRequest
      additionalProperties: false
    atsapbx.v1.ProvisionPrincipalResponse:
      type: object
      properties:
        principal:
          title: principal
          $ref: '#/components/schemas/atsapbx.v1.Principal'
      title: ProvisionPrincipalResponse
      additionalProperties: false
    atsapbx.v1.ProvisionTenantRequest:
      type: object
      properties:
        name:
          type: string
          title: name
        residencyZone:
          type: string
          title: residency_zone
      title: ProvisionTenantRequest
      additionalProperties: false
    atsapbx.v1.ProvisionTenantResponse:
      type: object
      properties:
        tenant:
          title: tenant
          $ref: '#/components/schemas/atsapbx.v1.Tenant'
      title: ProvisionTenantResponse
      additionalProperties: false
    atsapbx.v1.ResetPrincipalPasswordRequest:
      type: object
      properties:
        tenantId:
          type: string
          title: tenant_id
        principalId:
          type: string
          title: principal_id
        temporaryPassword:
          type: string
          title: temporary_password
          description: |-
            The temporary password, chosen by the administrator and given to the
             member out of band. Never echoed back.
      title: ResetPrincipalPasswordRequest
      additionalProperties: false
    atsapbx.v1.ResetPrincipalPasswordResponse:
      type: object
      title: ResetPrincipalPasswordResponse
      additionalProperties: false
    atsapbx.v1.RevokeApiKeyRequest:
      type: object
      properties:
        tenantId:
          type: string
          title: tenant_id
        apiKeyId:
          type: string
          title: api_key_id
      title: RevokeApiKeyRequest
      additionalProperties: false
    atsapbx.v1.RevokeApiKeyResponse:
      type: object
      title: RevokeApiKeyResponse
      additionalProperties: false
    atsapbx.v1.RevokeRoleRequest:
      type: object
      properties:
        tenantId:
          type: string
          title: tenant_id
        principalId:
          type: string
          title: principal_id
        role:
          type: string
          title: role
        scope:
          type: string
          title: scope
          description: '"tenant" when omitted.'
      title: RevokeRoleRequest
      additionalProperties: false
    atsapbx.v1.RevokeRoleResponse:
      type: object
      title: RevokeRoleResponse
      additionalProperties: false
    atsapbx.v1.RoleBinding:
      type: object
      properties:
        role:
          type: string
          title: role
        scope:
          type: string
          title: scope
          description: '"tenant" or "system".'
      title: RoleBinding
      additionalProperties: false
    atsapbx.v1.SetPrincipalStatusRequest:
      type: object
      properties:
        tenantId:
          type: string
          title: tenant_id
        principalId:
          type: string
          title: principal_id
        status:
          title: status
          $ref: '#/components/schemas/atsapbx.v1.PrincipalStatus'
      title: SetPrincipalStatusRequest
      additionalProperties: false
    atsapbx.v1.SetPrincipalStatusResponse:
      type: object
      properties:
        principal:
          title: principal
          $ref: '#/components/schemas/atsapbx.v1.Principal'
      title: SetPrincipalStatusResponse
      additionalProperties: false
    atsapbx.v1.SetTenantStatusRequest:
      type: object
      properties:
        tenantId:
          type: string
          title: tenant_id
        status:
          title: status
