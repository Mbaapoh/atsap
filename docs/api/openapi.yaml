security: []
tags:
  - name: atsapbx.v1.IdentityService
    description: |-
      IdentityService is the identity context's public contract: obtaining a
       token, administering tenants and principals, granting roles, issuing
       API keys, and reading audit history.

       Every method except AuthenticateUser requires
       `Authorization: Bearer <JWT>`. AuthenticateUser is exempt by
       necessity, not exception — a caller cannot hold a token before
       obtaining one.

       No message in this file carries a password, a password hash, an API
       key digest, or signing key material. The one raw API key the service
       ever emits is returned exactly once, by IssueApiKey, and by nothing
       else (spec requirement "A raw API key is returned once and never
       again").

       Failures disclose nothing about other tenants or accounts: every
       credential failure is the same Unauthenticated result whatever its
       cause, and a resource in another tenant answers as though it did not
       exist (INV-10).
  - name: atsapbx.v1.PbxService
    description: |-
      PbxService is pbx-core's public contract: the configuration a customer
       performs in the console, and which a partner may perform directly
       against the same API (BRD §16 — the console is a consumer of this API,
       not a privileged client with a private back door).

       Every method requires `Authorization: Bearer <JWT>` and acts only
       within the caller's own tenant. A resource belonging to another tenant
       answers exactly as one that does not exist (INV-10).

       **Nothing in this file names the media engine.** No endpoint
       identifier, dialplan context, transport, table or object of the
       underlying engine appears in any request, response, or error a caller
       can see. A customer configures "extension 1005"; how that becomes live
       engine state is the platform's business (PRD principle 4, DECISIONS
       D-47).

       The generated secret appears in exactly two responses —
       CreateExtension and RegenerateSecret — and in no other message, ever.
       It is shown once and is not retrievable afterwards; an extension whose
       secret is lost is rotated, not recovered.
  - name: atsapbx.v1.TelephonyService
    description: |-
      TelephonyService exposes telephony-core's public Call/Participant
       state. It never exposes an Asterisk channel identifier, or any other
       telephony-engine-internal identifier, anywhere in its contract —
       docs/hld/01-architecture.md §1.2 rule 3; spec requirement "No
       infrastructure channel identifier is ever exposed"
       (openspec/changes/telephony-core-originate-bridge-hangup/specs/telephony-core/call-lifecycle/spec.md).
