          title: dest_number
        startedAt:
          title: started_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        answeredAt:
          title: answered_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        endedAt:
          title: ended_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        durationSeconds:
          type: integer
          title: duration_seconds
          format: int32
          description: Seconds from answer to end; 0 for a call never answered.
        terminationReason:
          type: string
          title: termination_reason
      title: CallSummary
      additionalProperties: false
    atsapbx.v1.GetCallRequest:
      type: object
      properties:
        callId:
          type: string
          title: call_id
        tenantId:
          type: string
          title: tenant_id
          description: |-
            tenant_id is explicit here because no auth/identity layer exists yet
             to derive it from a request context (LLD-02, identity, is a later
             bounded context). Replaced by auth-derived tenant context once that
             lands — this field is a deliberate, temporary walking-skeleton
             scope choice, not a permanent API design.
