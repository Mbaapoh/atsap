          title: route
          $ref: '#/components/schemas/atsapbx.v1.Route'
      title: CreateRouteResponse
      additionalProperties: false
    atsapbx.v1.CreateTrunkRequest:
      type: object
      properties:
        tenantId:
          type: string
          title: tenant_id
        name:
          type: string
          title: name
        host:
          type: string
          title: host
        port:
          type: integer
          title: port
          format: int32
          description: 0 means the SIP default, 5060.
        authUsername:
          type: string
          title: auth_username
          description: |-
            Leave auth_username and secret empty for a carrier that
