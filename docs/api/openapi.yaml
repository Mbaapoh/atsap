openapi: 3.1.0
info: {}
paths:
  /atsapbx.v1.IdentityService/AuthenticateUser:
    post:
      tags:
        - atsapbx.v1.IdentityService
      summary: AuthenticateUser
      description: |-
        AuthenticateUser exchanges a username and password for a
         short-lived token. The only method reachable without one.
      operationId: atsapbx.v1.IdentityService.AuthenticateUser
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/atsapbx.v1.AuthenticateUserRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/atsapbx.v1.AuthenticateUserResponse'
  /atsapbx.v1.IdentityService/ProvisionTenant:
    post:
      tags:
        - atsapbx.v1.IdentityService
      summary: ProvisionTenant
      description: |-
        ProvisionTenant creates a tenant. Its residency zone is fixed here
         and cannot be changed afterwards.
      operationId: atsapbx.v1.IdentityService.ProvisionTenant
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/atsapbx.v1.ProvisionTenantRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/atsapbx.v1.ProvisionTenantResponse'
  /atsapbx.v1.IdentityService/ProvisionPrincipal:
    post:
      tags:
        - atsapbx.v1.IdentityService
      summary: ProvisionPrincipal
      description: ProvisionPrincipal creates a user account within a tenant.
      operationId: atsapbx.v1.IdentityService.ProvisionPrincipal
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/atsapbx.v1.ProvisionPrincipalRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/atsapbx.v1.ProvisionPrincipalResponse'
  /atsapbx.v1.IdentityService/SetTenantStatus:
    post:
      tags:
        - atsapbx.v1.IdentityService
      summary: SetTenantStatus
      description: |-
        SetTenantStatus suspends or reactivates a tenant. Reversible, and it
         never terminates a call already in progress (INV-03).
      operationId: atsapbx.v1.IdentityService.SetTenantStatus
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/atsapbx.v1.SetTenantStatusRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/atsapbx.v1.SetTenantStatusResponse'
  /atsapbx.v1.IdentityService/SetPrincipalStatus:
    post:
      tags:
        - atsapbx.v1.IdentityService
      summary: SetPrincipalStatus
      description: |-
        SetPrincipalStatus disables or reactivates an account. Takes effect
         on that account's next request, not at token expiry.
      operationId: atsapbx.v1.IdentityService.SetPrincipalStatus
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/atsapbx.v1.SetPrincipalStatusRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/atsapbx.v1.SetPrincipalStatusResponse'
  /atsapbx.v1.IdentityService/GrantRole:
    post:
      tags:
        - atsapbx.v1.IdentityService
      summary: GrantRole
      description: GrantRole binds a role to a principal within a scope.
      operationId: atsapbx.v1.IdentityService.GrantRole
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/atsapbx.v1.GrantRoleRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/atsapbx.v1.GrantRoleResponse'
  /atsapbx.v1.IdentityService/IssueApiKey:
    post:
      tags:
        - atsapbx.v1.IdentityService
      summary: IssueApiKey
      description: |-
        IssueApiKey creates a machine credential. Its response is the only
         place the usable key value ever appears.
      operationId: atsapbx.v1.IdentityService.IssueApiKey
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/atsapbx.v1.IssueApiKeyRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/atsapbx.v1.IssueApiKeyResponse'
  /atsapbx.v1.IdentityService/RevokeApiKey:
    post:
      tags:
        - atsapbx.v1.IdentityService
      summary: RevokeApiKey
      description: RevokeApiKey makes a key unusable immediately.
      operationId: atsapbx.v1.IdentityService.RevokeApiKey
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/atsapbx.v1.RevokeApiKeyRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/atsapbx.v1.RevokeApiKeyResponse'
  /atsapbx.v1.IdentityService/ListAudit:
    post:
      tags:
        - atsapbx.v1.IdentityService
      summary: ListAudit
      description: ListAudit returns the calling tenant's most recent audit records.
      operationId: atsapbx.v1.IdentityService.ListAudit
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/atsapbx.v1.ListAuditRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/atsapbx.v1.ListAuditResponse'
  /atsapbx.v1.PbxService/CreateExtension:
    post:
      tags:
        - atsapbx.v1.PbxService
      summary: CreateExtension
      description: |-
        CreateExtension provisions an extension and makes it registrable by
         a device. No apply step follows: it is live when this returns.
      operationId: atsapbx.v1.PbxService.CreateExtension
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/atsapbx.v1.CreateExtensionRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/atsapbx.v1.CreateExtensionResponse'
  /atsapbx.v1.PbxService/GetExtension:
    post:
      tags:
        - atsapbx.v1.PbxService
      summary: GetExtension
      description: |-
        GetExtension reads one extension, including whether a device is
         currently registered to it.
      operationId: atsapbx.v1.PbxService.GetExtension
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/atsapbx.v1.GetExtensionRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/atsapbx.v1.GetExtensionResponse'
  /atsapbx.v1.PbxService/ListExtensions:
    post:
      tags:
        - atsapbx.v1.PbxService
      summary: ListExtensions
      description: ListExtensions returns a page of the calling tenant's extensions.
      operationId: atsapbx.v1.PbxService.ListExtensions
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/atsapbx.v1.ListExtensionsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/atsapbx.v1.ListExtensionsResponse'
  /atsapbx.v1.PbxService/UpdateExtension:
    post:
      tags:
        - atsapbx.v1.PbxService
      summary: UpdateExtension
      description: |-
        UpdateExtension changes an extension's display name or device type.
         The number is immutable: renumbering would orphan every device
         already provisioned against it, so it is a delete plus a create.
      operationId: atsapbx.v1.PbxService.UpdateExtension
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/atsapbx.v1.UpdateExtensionRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/atsapbx.v1.UpdateExtensionResponse'
  /atsapbx.v1.PbxService/DeleteExtension:
    post:
      tags:
        - atsapbx.v1.PbxService
      summary: DeleteExtension
      description: |-
        DeleteExtension removes an extension and deprovisions it. A device
         holding its former credential can no longer register, immediately.
      operationId: atsapbx.v1.PbxService.DeleteExtension
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/atsapbx.v1.DeleteExtensionRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/atsapbx.v1.DeleteExtensionResponse'
  /atsapbx.v1.PbxService/RegenerateSecret:
    post:
      tags:
        - atsapbx.v1.PbxService
      summary: RegenerateSecret
      description: |-
        RegenerateSecret issues a new credential. The previous one stops
         working the moment this returns — two live credentials for one
         extension is the state a rotation exists to end.
      operationId: atsapbx.v1.PbxService.RegenerateSecret
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/atsapbx.v1.RegenerateSecretRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/atsapbx.v1.RegenerateSecretResponse'
  /atsapbx.v1.TelephonyService/GetCall:
    post:
      tags:
        - atsapbx.v1.TelephonyService
      summary: GetCall
      description: GetCall returns a Call's current state and participants.
      operationId: atsapbx.v1.TelephonyService.GetCall
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/atsapbx.v1.GetCallRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/atsapbx.v1.GetCallResponse'
components:
  schemas:
    atsapbx.v1.PrincipalStatus:
      type: string
      title: PrincipalStatus
      enum:
        - PRINCIPAL_STATUS_UNSPECIFIED
        - PRINCIPAL_STATUS_ACTIVE
        - PRINCIPAL_STATUS_DISABLED
      description: PrincipalStatus mirrors the domain's principal lifecycle.
    atsapbx.v1.TenantStatus:
      type: string
      title: TenantStatus
      enum:
        - TENANT_STATUS_UNSPECIFIED
        - TENANT_STATUS_ACTIVE
        - TENANT_STATUS_SUSPENDED
      description: TenantStatus mirrors the domain's tenant lifecycle.
    atsapbx.v1.AuditRecord:
      type: object
      properties:
        id:
          type:
            - integer
            - string
          title: id
          format: int64
        tenantId:
          type: string
          title: tenant_id
        actorId:
          type: string
          title: actor_id
        actorType:
          type: string
          title: actor_type
        action:
          type: string
          title: action
        resourceType:
          type: string
          title: resource_type
        resourceId:
          type: string
          title: resource_id
        beforeStateJson:
          type: string
          title: before_state_json
        afterStateJson:
          type: string
          title: after_state_json
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: AuditRecord
      additionalProperties: false
      description: |-
        AuditRecord is one immutable administrative mutation. Credential
         material is stripped before the record is written, so before_state and
         after_state never contain it.
    atsapbx.v1.AuthenticateUserRequest:
      type: object
      properties:
        tenantId:
          type: string
          title: tenant_id
          description: |-
            tenant_id is explicit because usernames are unique per tenant, never
             globally (AC-01.2) — two tenants may each have an "admin", and
             without a tenant there is no single account to resolve to.
        username:
          type: string
          title: username
        password:
          type: string
          title: password
      title: AuthenticateUserRequest
      additionalProperties: false
    atsapbx.v1.AuthenticateUserResponse:
      type: object
      properties:
        token:
          type: string
          title: token
          description: token is credential material. Never log it, never store it.
        expiresAt:
          title: expires_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        tenantId:
          type: string
          title: tenant_id
        principalId:
          type: string
          title: principal_id
      title: AuthenticateUserResponse
      additionalProperties: false
    atsapbx.v1.GrantRoleRequest:
      type: object
      properties:
        tenantId:
          type: string
          title: tenant_id
        principalId:
          type: string
          title: principal_id
        role:
          type: string
          title: role
        scope:
          type: string
          title: scope
          description: |-
            scope is "tenant" when omitted; "system" is platform-operator
             authority and is not grantable by a tenant's own administrators.
      title: GrantRoleRequest
      additionalProperties: false
    atsapbx.v1.GrantRoleResponse:
      type: object
      title: GrantRoleResponse
      additionalProperties: false
    atsapbx.v1.IssueApiKeyRequest:
      type: object
      properties:
        tenantId:
          type: string
          title: tenant_id
        principalId:
          type: string
          title: principal_id
        expiresAt:
          title: expires_at
          description: |-
            expires_at is optional; omitted means the key does not expire on its
             own and must be revoked to stop working.
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: IssueApiKeyRequest
      additionalProperties: false
    atsapbx.v1.IssueApiKeyResponse:
      type: object
      properties:
        apiKeyId:
          type: string
          title: api_key_id
        rawKey:
          type: string
          title: raw_key
          description: |-
            raw_key is the usable credential, returned here and nowhere else,
             ever. Losing it means issuing a new key — it cannot be recovered
             from what is stored.
        expiresAt:
          title: expires_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: IssueApiKeyResponse
      additionalProperties: false
    atsapbx.v1.ListAuditRequest:
      type: object
      properties:
        tenantId:
          type: string
          title: tenant_id
        limit:
          type: integer
          title: limit
          format: int32
          description: |-
            limit defaults to a server-chosen bound when zero. No cursor: a
             partner needing pagination will say so, and guessing the shape now
             freezes a contract nobody has asked for (D-25).
      title: ListAuditRequest
      additionalProperties: false
    atsapbx.v1.ListAuditResponse:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/atsapbx.v1.AuditRecord'
          title: records
      title: ListAuditResponse
      additionalProperties: false
    atsapbx.v1.Principal:
      type: object
      properties:
        principalId:
          type: string
          title: principal_id
        tenantId:
          type: string
          title: tenant_id
        username:
          type: string
          title: username
        email:
          type: string
          title: email
        role:
          type: string
          title: role
        status:
          title: status
          $ref: '#/components/schemas/atsapbx.v1.PrincipalStatus'
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: Principal
      additionalProperties: false
      description: |-
        Principal is a user account. It carries no credential representation:
         there is deliberately no password or hash field here.
    atsapbx.v1.ProvisionPrincipalRequest:
      type: object
      properties:
        tenantId:
          type: string
          title: tenant_id
        username:
          type: string
          title: username
        email:
          type: string
          title: email
        password:
          type: string
          title: password
          description: |-
            password is accepted here and never echoed back: the response
             carries a Principal, which has no field for it.
        role:
          type: string
          title: role
      title: ProvisionPrincipalRequest
      additionalProperties: false
    atsapbx.v1.ProvisionPrincipalResponse:
      type: object
      properties:
        principal:
          title: principal
          $ref: '#/components/schemas/atsapbx.v1.Principal'
      title: ProvisionPrincipalResponse
      additionalProperties: false
    atsapbx.v1.ProvisionTenantRequest:
      type: object
      properties:
        name:
          type: string
          title: name
        residencyZone:
          type: string
          title: residency_zone
      title: ProvisionTenantRequest
      additionalProperties: false
    atsapbx.v1.ProvisionTenantResponse:
      type: object
      properties:
        tenant:
          title: tenant
          $ref: '#/components/schemas/atsapbx.v1.Tenant'
      title: ProvisionTenantResponse
      additionalProperties: false
    atsapbx.v1.RevokeApiKeyRequest:
      type: object
      properties:
        tenantId:
          type: string
          title: tenant_id
        apiKeyId:
          type: string
          title: api_key_id
      title: RevokeApiKeyRequest
      additionalProperties: false
    atsapbx.v1.RevokeApiKeyResponse:
      type: object
      title: RevokeApiKeyResponse
      additionalProperties: false
    atsapbx.v1.SetPrincipalStatusRequest:
      type: object
      properties:
        tenantId:
          type: string
          title: tenant_id
        principalId:
          type: string
          title: principal_id
        status:
          title: status
          $ref: '#/components/schemas/atsapbx.v1.PrincipalStatus'
      title: SetPrincipalStatusRequest
      additionalProperties: false
    atsapbx.v1.SetPrincipalStatusResponse:
      type: object
      properties:
        principal:
          title: principal
          $ref: '#/components/schemas/atsapbx.v1.Principal'
      title: SetPrincipalStatusResponse
      additionalProperties: false
    atsapbx.v1.SetTenantStatusRequest:
      type: object
      properties:
        tenantId:
          type: string
          title: tenant_id
        status:
          title: status
