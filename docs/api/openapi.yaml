        tenantId:
          type: string
          title: tenant_id
        extensionId:
          type: string
          title: extension_id
          description: The extension placing the call; it must have a registered device.
        destination:
          type: string
          title: destination
          description: 'The digits as dialled: an optional leading + then digits only.'
      title: PlaceCallRequest
      additionalProperties: false
    atsapbx.v1.PlaceCallResponse:
