          type: string
          title: name
        status:
          title: status
          $ref: '#/components/schemas/atsapbx.v1.TenantStatus'
        residencyZone:
          type: string
          title: residency_zone
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: Tenant
      additionalProperties: false
      description: Tenant is a partner organisation.
    atsapbx.v1.CapacityLevel:
      type: string
      title: CapacityLevel
      enum:
        - CAPACITY_LEVEL_UNSPECIFIED
        - CAPACITY_LEVEL_NORMAL
        - CAPACITY_LEVEL_WARNING
        - CAPACITY_LEVEL_REACHED
      description: CapacityLevel is live usage against the channels in force.
    atsapbx.v1.LicenseCondition:
      type: string
      title: LicenseCondition
      enum:
        - LICENSE_CONDITION_UNSPECIFIED
        - LICENSE_CONDITION_SETUP
        - LICENSE_CONDITION_DEGRADED
        - LICENSE_CONDITION_CAPACITY_REACHED
        - LICENSE_CONDITION_ENTITLEMENT_UNVERIFIED
        - LICENSE_CONDITION_CAPACITY_WARNING
        - LICENSE_CONDITION_FREE_COMMUNITY
        - LICENSE_CONDITION_VALID
      description: |-
        LicenseCondition is the one PRD §11.2 state the installation is in: the
         most urgent of its facts, chosen by the server (LLD-08 §6.1, D-70). A
         client shows it as-is and never derives it. Precedence, most urgent
         first: SETUP, DEGRADED, CAPACITY_REACHED, ENTITLEMENT_UNVERIFIED,
         CAPACITY_WARNING, FREE_COMMUNITY, VALID.
    atsapbx.v1.LicenseState:
      type: string
      title: LicenseState
      enum:
        - LICENSE_STATE_UNSPECIFIED
        - LICENSE_STATE_NOT_ACTIVATED
        - LICENSE_STATE_VALID
        - LICENSE_STATE_UNVERIFIED
        - LICENSE_STATE_DEGRADED
      description: LicenseState is where the licence stands.
    atsapbx.v1.LicenseTier:
      type: string
      title: LicenseTier
      enum:
        - LICENSE_TIER_UNSPECIFIED
        - LICENSE_TIER_FREE_COMMUNITY
        - LICENSE_TIER_COMMERCIAL
      description: LicenseTier is which kind of entitlement is in force.
    atsapbx.v1.ApplyLicenseKeyRequest:
      type: object
      properties:
        token:
          type: string
          title: token
          description: The signed licence token, exactly as issued. Never echoed back.
      title: ApplyLicenseKeyRequest
      additionalProperties: false
    atsapbx.v1.ApplyLicenseKeyResponse:
      type: object
      properties:
        status:
          title: status
          description: The licence now in force.
          $ref: '#/components/schemas/atsapbx.v1.LicenseStatus'
      title: ApplyLicenseKeyResponse
      additionalProperties: false
    atsapbx.v1.GetLicenseStatusRequest:
      type: object
      title: GetLicenseStatusRequest
      additionalProperties: false
    atsapbx.v1.GetLicenseStatusResponse:
      type: object
      properties:
        status:
          title: status
          $ref: '#/components/schemas/atsapbx.v1.LicenseStatus'
      title: GetLicenseStatusResponse
      additionalProperties: false
    atsapbx.v1.LicenseStatus:
      type: object
      properties:
        state:
          title: state
          $ref: '#/components/schemas/atsapbx.v1.LicenseState'
        edition:
          type: string
          title: edition
        channels:
          type: integer
          title: channels
          format: int32
          description: Concurrent call channels the licence in force allows.
        channelsInUse:
          type: integer
          title: channels_in_use
          format: int32
          description: Channels in use right now.
        maxTenants:
          type: integer
          title: max_tenants
          format: int32
          description: 0 means unlimited.
        maxExtensions:
          type: integer
          title: max_extensions
          format: int32
        expiresAt:
          title: expires_at
          description: Absent when the licence does not expire, or none is in force.
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        lastConfirmedAt:
          title: last_confirmed_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        reason:
          type: string
          title: reason
          description: |-
            Why the state is not VALID, e.g. "not_activated", "expired",
             "tampered". Empty when VALID.
        condition:
          title: condition
          description: |-
            The headline condition, the tier and the capacity level, computed by
             the server (LLD-08 §6.1, D-70).
          $ref: '#/components/schemas/atsapbx.v1.LicenseCondition'
        tier:
          title: tier
          $ref: '#/components/schemas/atsapbx.v1.LicenseTier'
        capacity:
          title: capacity
          $ref: '#/components/schemas/atsapbx.v1.CapacityLevel'
      title: LicenseStatus
      additionalProperties: false
    atsapbx.v1.DeviceType:
      type: string
      title: DeviceType
      enum:
        - DEVICE_TYPE_UNSPECIFIED
        - DEVICE_TYPE_WEBRTC
        - DEVICE_TYPE_SIP
      description: DeviceType is how a device attaches to an extension.
    atsapbx.v1.RegistrationStatus:
      type: string
      title: RegistrationStatus
      enum:
        - REGISTRATION_STATUS_UNSPECIFIED
        - REGISTRATION_STATUS_NOT_REGISTERED
        - REGISTRATION_STATUS_REGISTERED
      description: |-
        RegistrationStatus describes the DEVICE, not the configuration. An
         extension is configured and live from the moment it is created,
         whether or not anything has registered to it — there is no "pending"
         state, because there is nothing to apply.
    atsapbx.v1.TrunkHealth:
      type: string
      title: TrunkHealth
      enum:
        - TRUNK_HEALTH_UNSPECIFIED
        - TRUNK_HEALTH_HEALTHY
        - TRUNK_HEALTH_DEGRADED
        - TRUNK_HEALTH_UNHEALTHY
      description: |-
        TrunkHealth is what the platform has OBSERVED about a carrier from
         call outcomes. No request carries it: a trunk shown healthy because
         someone ticked a box would be worse than showing nothing.
    atsapbx.v1.CreateEmergencyNumberRequest:
      type: object
      properties:
        tenantId:
          type: string
          title: tenant_id
        number:
          type: string
          title: number
          description: Digits with an optional leading +, e.g. "1500".
      title: CreateEmergencyNumberRequest
      additionalProperties: false
    atsapbx.v1.CreateEmergencyNumberResponse:
      type: object
      title: CreateEmergencyNumberResponse
      additionalProperties: false
    atsapbx.v1.CreateExtensionRequest:
      type: object
      properties:
        tenantId:
          type: string
          title: tenant_id
        number:
          type: string
          title: number
        displayName:
          type: string
          title: display_name
        deviceType:
          title: device_type
          description: |-
            Note there is no secret field. The platform generates the
             credential; a caller cannot choose one, because a chosen secret
             would be the weak link in a digest that is offline-crackable.
          $ref: '#/components/schemas/atsapbx.v1.DeviceType'
      title: CreateExtensionRequest
      additionalProperties: false
    atsapbx.v1.CreateExtensionResponse:
      type: object
      properties:
        extension:
          title: extension
          $ref: '#/components/schemas/atsapbx.v1.Extension'
        secret:
          type: string
          title: secret
          description: |-
            The generated secret, returned exactly once. Never logged, never
             audited, never retrievable by any later call.
      title: CreateExtensionResponse
      additionalProperties: false
    atsapbx.v1.CreateInboundNumberRequest:
      type: object
      properties:
        tenantId:
          type: string
          title: tenant_id
        number:
          type: string
          title: number
        extensionId:
          type: string
          title: extension_id
      title: CreateInboundNumberRequest
      additionalProperties: false
    atsapbx.v1.CreateInboundNumberResponse:
      type: object
      properties:
        inboundNumber:
          title: inbound_number
          $ref: '#/components/schemas/atsapbx.v1.InboundNumber'
      title: CreateInboundNumberResponse
      additionalProperties: false
    atsapbx.v1.CreateRouteRequest:
      type: object
      properties:
        tenantId:
          type: string
          title: tenant_id
        prefixPattern:
          type: string
          title: prefix_pattern
        trunkId:
          type: string
          title: trunk_id
        costPerMinuteMicros:
          type:
            - integer
            - string
          title: cost_per_minute_micros
          format: int64
        priority:
          type: integer
          title: priority
          format: int32
      title: CreateRouteRequest
      additionalProperties: false
    atsapbx.v1.CreateRouteResponse:
      type: object
      properties:
