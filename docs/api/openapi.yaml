        secret:
          type: string
          title: secret
        channelLimit:
          type: integer
          title: channel_limit
          format: int32
          description: Concurrent-call cap on this trunk; must be positive.
        priority:
          type: integer
          title: priority
          format: int32
      title: CreateTrunkRequest
      additionalProperties: false
    atsapbx.v1.CreateTrunkResponse:
      type: object
