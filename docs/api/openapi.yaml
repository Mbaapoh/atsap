          title: host
          description: A hostname or IP address, with no scheme, port or user part.
        port:
          type: integer
          title: port
          format: int32
        transport:
          type: string
          title: transport
          description: '"udp", "tcp" or "tls".'
      title: GetSipRegistrarResponse
      additionalProperties: false
    atsapbx.v1.HangupCallRequest:
