      additionalProperties: false
    atsapbx.v1.Participant:
      type: object
      properties:
        participantId:
          type: string
          title: participant_id
        role:
          type: string
          title: role
          description: 'role is one of: CALLER, AGENT, IVR, QUEUE, SUPERVISOR, SPECIALIST, AI.'
        endpointUri:
          type: string
          title: endpoint_uri
        state:
          type: string
          title: state
          description: |-
            state is one of: Invited, Ringing, Connected, OnHold, Transferring,
