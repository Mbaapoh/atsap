    atsapbx.v1.Trunk:
      type: object
      properties:
        trunkId:
          type: string
          title: trunk_id
        name:
          type: string
          title: name
        host:
          type: string
          title: host
          description: A hostname or IP address — no scheme, port or user part.
        port:
          type: integer
          title: port
          format: int32
        authUsername:
          type: string
          title: auth_username
          description: |-
            The carrier digest username, if the carrier uses one. Configuration,
             not a secret, so it is shown, as every SIP-trunk interface shows it.
        hasSecret:
          type: boolean
          title: has_secret
          description: |-
