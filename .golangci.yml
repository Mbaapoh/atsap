version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - depguard
  settings:
    depguard:
      rules:
        # Architectural invariant (HLD 01-architecture.md §1.2 rule 3,
        # TRD "Architecture style", LLD-01 §2): raw Asterisk concepts stay
        # inside telephony/acl. Domain/application/shared code must never
        # import the ARI/AMI adapters directly — it depends on the ports in
        # telephony/ports and receives adapters via dependency injection.
        # cmd/ (composition root) and cmd/ari-playground (dev tool) are
        # deliberately NOT guarded here; the walking-skeleton apply adds the
        # strict AST dependency test (LLD-01 §8 DoD item 8).
        acl-adapter-boundary:
          files:
            - "**/internal/telephony/domain/**"
            - "**/internal/telephony/application/**"
            - "**/internal/shared/**"
          deny:
            - pkg: atsap-api/internal/telephony/acl/ari
              desc: "Asterisk ARI adapters stay inside telephony/acl (HLD 01 §1.2, LLD-01 §2)"
            - pkg: atsap-api/internal/telephony/acl/ami
              desc: "Asterisk AMI adapters stay inside telephony/acl (HLD 01 §1.2, LLD-01 §2)"

        # Same invariant, pbx-core's side (D-41, D-47, LLD-03 §2): the
        # PJSIP Realtime projection is Asterisk's vocabulary and stays
        # inside pbx/acl/asterisk. Domain, application and rpc reach the
        # engine only through ports.EndpointProjector.
        #
        # depguard matches import paths, not string literals, so it cannot
        # stop someone typing "ps_endpoints" into a query in the wrong
        # package. That half is covered by ScanEngineTableNames in
        # internal/archtest, which parses each file and inspects only
        # string literals — never comments, because explaining why a
        # projection exists is good practice, not a leak. Stated here
        # rather than left implied: a gate believed to cover more than it
        # does is worse than no gate (D-28).
        pbx-acl-boundary:
          files:
            - "**/internal/pbx/domain/**"
            - "**/internal/pbx/application/**"
            - "**/internal/pbx/ports/**"
            - "**/internal/pbx/rpc/**"
            - "**/internal/pbx/postgres/**"
          deny:
            - pkg: atsap-api/internal/pbx/acl/asterisk
              desc: "The Asterisk projection stays behind ports.EndpointProjector (D-41, D-47, LLD-03 §2)"

        # Bounded-context separation (HLD 04 §10.1): telephony-core must
        # not depend on pbx-core in either direction of import. pbx-core
        # may depend on telephony-core — it is Tier 1 and telephony-core is
        # Tier 0 — so only this direction is denied.
        telephony-must-not-import-pbx:
          files:
            - "**/internal/telephony/**"
          deny:
            - pkg: atsap-api/internal/pbx
              desc: "telephony-core must not depend on pbx-core (HLD 04 §10.1). Inbound routing inverts the dependency with a port telephony-core owns"

        # licensing is Tier 0 and depends on NOTHING (HLD 04 §10.1).
        #
        # The rule exists before the package does, deliberately: the
        # first import is the cheapest one to reject, and a boundary
        # added after the code is a boundary argued about rather than
        # enforced.
        #
        # The pressure this resists is real and will look reasonable at
        # the time. licensing publishes a tenant cap that identity
        # enforces (D-51) and a module entitlement that consumers read
        # (D-50), so "just import identity to check the tenant count"
        # is the obvious shortcut. It is denied here because the
        # entitlement flows the other way: licensing publishes, others
        # consume, and the conjunction is entitlement's job (LLD-11).
        licensing-imports-nothing:
          files:
            - "**/internal/licensing/**"
          deny:
            - pkg: atsap-api/internal/telephony
              desc: "licensing is Tier 0 and depends on nothing (HLD 04 §10.1). telephony-core calls licensing through a port it owns; the composition root adapts between the two verdict types (LLD-08 §3.1)"
            - pkg: atsap-api/internal/pbx
              desc: "licensing is Tier 0 and depends on nothing (HLD 04 §10.1). pbx-core consumes the published entitlement; it is never called back into"
            - pkg: atsap-api/internal/identity
              desc: "licensing is Tier 0 and depends on nothing (HLD 04 §10.1). identity and licensing are peers that never call each other — combining tenant state with entitlement is the entitlement context's job (D-50, LLD-11)"

        # The broker stays behind the outbox (D-57). Application, domain
        # and rpc code publishes by writing an outbox row inside its own
        # transaction — it never talks to NATS, and never imports it.
        #
        # This is what makes the broker replaceable rather than merely
        # unreplaced: substituting Kafka, RabbitMQ or Redis Streams is
        # one adapter package plus one line in the composition root,
        # because the durability decision belongs to the outbox pattern
        # and not to NATS. Without this rule that property held only by
        # habit — internal/nats happened to be imported by exactly one
        # file, and nothing stopped the second.
        #
        # internal/postgres is deliberately absent from this list: it
        # owns OutboxWorker, which is the one component whose job is to
        # take rows to a publisher. It depends on the port in
        # internal/shared/ports, never on internal/nats.
        broker-stays-behind-the-outbox:
          files:
            - "**/internal/*/application/**"
            - "**/internal/*/domain/**"
            - "**/internal/*/rpc/**"
            - "**/internal/*/ports/**"
            - "**/internal/shared/**"
          deny:
            - pkg: atsap-api/internal/nats
              desc: "Publish by writing an outbox row, not by importing the broker (D-57). The contract is ports.OutboxPublisher in internal/shared/ports; internal/nats is an adapter wired only in cmd/"

  # The boundary rules above protect the SHIPPED dependency graph. An
  # integration or e2e test wiring a real adapter is not part of that
  # graph: Go links `package application_test` separately, and the file
  # is behind a build tag that production builds never see. Such a test
  # is a composition root, doing on a small scale what cmd/atsap-api's
  # main.go does — which is why internal/archtest already exempts
  # internal/telephony/e2e by name for exactly this reason.
  #
  # Scoped to the two tagged test suffixes, not to _test.go generally:
  # an ordinary unit test has no business constructing an ACL adapter,
  # and every non-test file stays matched. Before this exclusion existed
  # the rule was not passing on these files — it was never run against
  # them (see .mise.toml's lint task).
  exclusions:
    rules:
      - path: '_integration_test\.go'
        linters:
          - depguard
      - path: '_e2e_test\.go'
        linters:
          - depguard

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: atsap-api
